if(a==='copy-raw'){const text=$('#raw-text').textContent;try{await navigator.clipboard.writeText(text);toast('JSON copied')}catch{const r=document.createRange();r.selectNodeContents($('#raw-text'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);toast('JSON selected. Press ⌘C or Ctrl+C to copy.')}return}
if(a.startsWith('observation-')){const i=Number(a.slice(12)),s=sessions[state.session],m=modelRows(s)[i];openDialog('Model-call observation',`<dl><div><dt>Observation ID</dt><dd class="mono">${m.id}</dd></div><div><dt>Model / sequence</dt><dd>${s.model} / ${i}</dd></div><div><dt>Started / ended · UTC</dt><dd class="mono">2026-06-0${s.day}T02:51:${i?'30.001':'06.901'}Z<br>2026-06-0${s.day}T02:${i?'52:00.698':'51:29.887'}Z</dd></div><div><dt>Accounting semantics</dt><dd>${s.agent==='codex'?'tracelab-codex':'tracelab-claude'}</dd></div></dl><button class="btn primary" data-action="raw-${i}">Source record ${icon('arrow')}</button>`);return}
if(a==='interval'){openDialog('Declared and observed time',`<p><strong>Declared start: Unavailable</strong><br><strong>Declared end: Unavailable</strong></p><p>The source did not declare session bounds. AgentScope derives observed bounds from accepted child timestamps; it does not invent declared values.</p><p>The supplied example spans 2026-06-04T02:51:06.901Z to 2026-06-04T02:52:00.698Z. This is not active time.</p>`,'popover');return}
if(a==='session-coverage'){const s=sessions[state.session];openDialog('Session token coverage',`<p><strong>${fmt(s.input)} input tokens</strong> over <strong>${s.calls} / ${s.calls} calls</strong> with known input usage.</p><p>Missing is not zero. A measured zero is included in known coverage; a null value is excluded from the sum and lowers coverage.</p><p>Accounting tag: ${s.agent==='codex'?'tracelab-codex':'tracelab-claude'}.</p>`,'popover');return}
if(a==='diagnostics'){openDialog('Session diagnostics',`<div class="note good">${icon('check')}<span>No conflicting values or reversed intervals for this session.</span></div><p>Diagnostics identify the field, code and explanation. Conflicting identities are shown, not overwritten.</p><button class="textbtn" data-action="diagnostic-example">Inspect a design example ${icon('arrow')}</button>`);return}
if(a==='diagnostic-example'){openDialog('Diagnostics · example state',`${note('Separate illustrative scenario; not attached to the fixture session.','warn')}<table><caption>Conflicting values and reversed intervals</caption><thead><tr><th>Code / field</th><th>Explanation</th></tr></thead><tbody><tr><td><code>conflicting_value</code><br>agent</td><td>One record claims claude-code; another claims codex. Both claims are retained. No silent overwrite.</td></tr><tr><td><code>reversed_interval</code><br>ended_at</td><td>End 02:51:00Z precedes start 02:51:06Z. Excluded from the derived interval.</td></tr></tbody></table><button class="textbtn" data-action="file-raw-0">Inspect example source record ${icon('arrow')}</button>`);return}
if(a==='profile'){openDialog('Local field profile',`<p><strong>swe-chat-conversations.parquet</strong><br>2,000-row excerpt of a 1.3 GB upstream dataset. Profiled locally; the upstream file exceeds the 25 MiB upload limit.</p><table><caption>Illustrative field profile · 2,000 rows</caption><thead><tr><th>Field</th><th>Type</th><th>Present / rows</th></tr></thead><tbody>${[['conversation_id','string','2,000 / 2,000'],['turns[]','array of structs','2,000 / 2,000'],['turns[].role','string','2,000 / 2,000'],['turns[].content','string · redacted','2,000 / 2,000'],['turns[].tool_calls[]','array · bounded','1,240 / 2,000'],['model','string','2,000 / 2,000'],['usage.prompt_tokens','integer | null','1,870 / 2,000'],['usage.completion_tokens','integer | null','1,870 / 2,000'],['created_at','integer · 10 digits','2,000 / 2,000'],['repo','string · redacted','1,920 / 2,000']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>${note('Profile presence is not token coverage. Preview determines emitted-call usage coverage.')}<button class="textbtn" data-action="redaction">Review outgoing context ${icon('arrow')}</button>`);return}
if(a==='redaction'){openDialog('Review what will be sent',`<p><strong>Destination:</strong> configured OpenAI-compatible provider.<br>This prototype simulates the provider locally; it sends nothing.</p><table><caption>Sanitised assistant context</caption><thead><tr><th>Included</th><th>Removed</th></tr></thead><tbody><tr><td>Field names, types, presence counts</td><td>Message content and prompts</td></tr><tr><td>3 bounded sample records</td><td>Tool arguments and outputs</td></tr><tr><td>Usage numbers and timestamp shapes</td><td>Repository, user and conversation identifiers</td></tr><tr><td>Current draft and your instruction</td><td>API keys and environment secrets</td></tr></tbody></table><pre>{\n  "conversation_id": "[REDACTED_ID]",\n  "turns": [{ "role": "assistant",\n    "content": "[REDACTED]", "tool_calls": [] }],\n  "model": "gpt-5.5-codex",\n  "usage": {"prompt_tokens": 12431,\n            "completion_tokens": 334},\n  "created_at": 1780541466,\n  "repo": "[REDACTED_REPO]"\n}</pre>${note('Free-text instructions are included. Do not paste secrets. In production, the provider and model names must be shown here before approval.')}<button class="btn primary" data-action="approve-context">Approve this context ${icon('check')}</button>`);return}
if(a==='approve-context'){state.redaction=true;closeDialog();render();toast('Sanitised context approved for this prototype conversation');return}
if(a==='ambiguity'){openDialog('Confirm the timestamp unit',`<div class="eyebrow">created_at → model_call.started_at</div><p>The sample contains <code>1780541466</code>. As epoch seconds, it resolves to <strong>2026-06-04T02:51:06Z</strong>. As milliseconds, it falls in January 1970.</p><p>The value shape suggests seconds, but the mapping needs your explicit decision.</p><button class="btn primary" data-action="resolve-epoch">Use epoch seconds ${icon('check')}</button><p class="small">This adds an allowlisted timestamp conversion. The model does not execute code.</p>`,'popover');return}
if(a==='suggest-epoch'||a==='resolve-epoch'){state.epoch=true;state.timeUnit='seconds';state.mappingDirty=true;state.validated=false;state.assistantPreview=false;state.saved=false;if(a==='suggest-epoch'){state.chat.push({role:'user',text:'Use epoch seconds.'},{role:'assistant',text:'Applied locally to the shared draft: created_at → timestamp in seconds → UTC. Validate the updated mapping before previewing.'})}closeDialog();render();announce('Timestamp unit set to epoch seconds. Previous preview invalidated.');return}
if(a.startsWith('explain-')){const i=Number(a.slice(8));openDialog('Why this field mapping?',`<div class="eyebrow">${targets[i]}</div><p>${['conversation_id is present on every sampled row. Session identities are scoped by source and harness; this is not a global deduplication key.','usage.prompt_tokens has an integer shape. Preserve null and absent values; do not substitute 0. This mapping assumes usage belongs to the root observation, not every turn.','usage.completion_tokens maps to output tokens. No multiplication across turns. Null remains unknown.','created_at has a 10-digit integer shape consistent with epoch seconds. Confirm the unit explicitly; never silently treat it as milliseconds.','Bounded expansion of turns[*].tool_calls[*] emits each tool once. All tools reference the enclosing root model-call observation. Revisit this rule if usage actually belongs to individual turns.'][i]}</p>${note('Proposal assumption: one recorded root model-call observation per conversation plus bounded tool emissions. Conversation-level usage must not be repeated per turn. Review this source-accounting assumption before production.','warn')}<button class="textbtn" data-action="additional-fields">Review identity and parent rules ${icon('arrow')}</button>`);return}
if(a==='additional-fields'){openDialog('Remaining mapping bindings',`<table><caption>Required relationships and labels</caption><thead><tr><th>Source</th><th>Target / policy</th></tr></thead><tbody><tr><td><code>$.model</code></td><td>model_call.model · nullable</td></tr><tr><td><code>$.repo</code></td><td>session.repo · nullable</td></tr><tr><td>Enclosing root observation</td><td>tool_call.model_call_id · validated parent reference</td></tr></tbody></table><p>Session source namespace: swe-chat. Harness is explicitly unknown unless declared in the source contract. Provider labels are not automatically treated as harness identity.</p>${note('Illustrative proposal emits one root model call per conversation. Root usage is never copied to each turn.')}<p>Tools are expanded through bounded nested arrays. Mapping execution must validate the required session and parent relationships.</p>`);return}
if(a==='mapping-dsl'){openDialog('Mapping document · design representation',`<p>The shared table edits a declarative mapping. This excerpt illustrates intent; it is not a validated serialisation of the production DSL AST.</p><pre>{\n  "dsl_version": 1,\n  "source": "swe-chat",\n  "session_key": "$.conversation_id",\n  "model_call_collection": "$",\n  "input_tokens": "$.usage.prompt_tokens",\n  "output_tokens": "$.usage.completion_tokens",\n  "timestamp_unit": "${state.epoch?'seconds':'UNRESOLVED'}",\n  "tools": "$.turns[*].tool_calls[*]",\n  "null_policy": "nullable"\n}</pre><p>No generated code, joins, recursion or aggregation. Actual document validation remains server-authoritative.</p>`);return}
if(a==='validate'){validateMapping();return}
if(a==='assistant-preview'){if(!state.validated)return;busy('Previewing the current draft…',()=>{state.assistantPreview=true;render();toast('Preview passed for 200 sampled records')});return}
if(a==='assistant-preview-detail'){openDialog('Draft preview',`<p>First 200 of 2,000 excerpt rows. Preview makes no observation writes.</p><table><caption>Illustrative preview result</caption><thead><tr><th>Population</th><th>Result</th></tr></thead><tbody><tr><td>Source records</td><td>200 accepted / 0 partial / 0 rejected</td></tr><tr><td>Emitted entities</td><td>200 sessions / 200 model calls / 628 tools</td></tr><tr><td>Missing-field warnings</td><td>26 null / 8 absent</td></tr><tr><td>Known input-token coverage</td><td>187 / 200 model calls</td></tr></tbody></table>${note('Missing usage stays unavailable for affected observations. Root usage is emitted once per conversation, never repeated per turn.','warn')}<pre>{"entity":"model_call","locator":"row:1",\n "fields":{"model":"gpt-5.5-codex",\n "input_tokens":12431,"output_tokens":334}}</pre><p>No rejects in this sample. The full run can contain additional warnings or rejects.</p>`);return}
if(a==='save-revision'){if(!state.validated||!state.assistantPreview)return;state.saved=true;state.revision++;state.mappingDirty=false;render();toast(`swe-chat-v1 revision ${state.revision} saved locally in this prototype`);return}
if(a==='assistant-import'){openDialog('Confirm the excerpt import',`<p>Import <strong>2,000 records</strong> from the local excerpt of <strong>swe-chat-conversations.parquet</strong> into <strong>swe-chat</strong>.</p><dl><div><dt>Saved revision</dt><dd>swe-chat-v1 · revision ${state.revision} · map_swe_example_r${state.revision}</dd></div><div><dt>Excerpt SHA-256 · illustrative identity</dt><dd class="hash mono">19bd0d698f3ef02b5c13d548fd29c67cf7dfb5e580074192d11f3747a8a6d398</dd></div></dl>${note('The preview covered 200 of 2,000 rows. Full-run outcomes may differ. The 1.3 GB upstream file is not being uploaded.')}<label class="checkbox"><input id="swe-confirm" type="checkbox"><span>I approve this excerpt and saved revision for import.</span></label><button class="btn primary" data-action="commit-swe" disabled>Import 2,000 records ${icon('arrow')}</button>`);return}
if(a==='commit-swe'){if(!$('#swe-confirm')?.checked)return;busy('Importing the approved excerpt…',()=>{openDialog('Excerpt import committed',`${note('Simulated full-run result. This design study does not persist observations.','good','check')}<div class="outcomes" style="padding:0"><div><strong>2,000</strong><span>Accepted</span></div><div><strong>0</strong><span>Partial</span></div><div><strong>0</strong><span>Duplicate</span></div><div><strong>0</strong><span>Rejected</span></div><div><strong>0</strong><span>Ignored</span></div></div><p>2,000 sessions / 2,000 model-call observations / 6,280 tool-call observations. Illustrative full-run counts.</p><p>The saved revision can be reused with the provider disabled. The dashboard prototype retains its TraceLab review fixture.</p><a class="btn primary" href="#dashboard" data-close-link>Open workspace overview ${icon('arrow')}</a>`)});return}
if(a==='error-detail'){openDialog('Request details',`<div class="tag bad">${route==='assistant'?'invalid_proposal':'request_failed'}</div><p>${route==='assistant'?'The provider returned a malformed mapping. One bounded repair attempt failed. Your last valid draft was retained.':'Example HTTP 503 response. No commit request was sent by this loading error.'}</p><pre>{"error":{"code":"${route==='assistant'?'invalid_proposal':'request_failed'}",\n "message":"${route==='assistant'?'Proposal validation failed':'Service temporarily unavailable'}",\n "details":[]}}</pre>`);return}
}
function rejectTable(){return `<table><caption>1 rejected source record · example scenario</caption><thead><tr><th>Locator / rule</th><th>Failure</th><th>Payload</th></tr></thead><tbody><tr><td><code>line:1042</code><span class="sub">model_call</span></td><td><span class="tag bad">invalid_type</span><span class="sub mono">$.usage.input_tokens</span><span class="sub">expected integer, got string '12,431'</span></td><td><button class="textbtn" data-action="reject-raw">Raw JSON ${icon('arrow')}</button></td></tr></tbody></table>`}
document.addEventListener('click',e=>{const chart=e.target.closest('[data-chart]');if(chart){e.preventDefault();state.drill={type:chart.dataset.chart,key:chart.dataset.key,page:0};showDrill();return}const a=e.target.closest('[data-action]');if(a){action(a.dataset.action,a);return}const link=e.target.closest('[data-close-link],[data-session-link]');if(link){if(link.hasAttribute('data-reset-state'))state.ui='success';closeDialog();}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='confirm'){state.confirmed=t.checked;$('[data-action="commit"]').disabled=!t.checked}if(t.id==='swe-confirm')$('[data-action="commit-swe"]').disabled=!t.checked;if(t.id==='upload-file')uploadExample(t.files?.[0]);if(t.dataset.filter){state.filter[t.dataset.filter]=t.value;state.page=0;const key=t.dataset.filter;render();$(`[data-filter="${key}"]`).focus();announce(`${scoped().length} sessions match the filters`)}if(t.id==='history-status'){let n=0;$$('tr[data-status]').forEach(r=>{r.hidden=!!t.value&&r.dataset.status!==t.value;if(!r.hidden)n++});$('#history-count').textContent=`${n} attempt${n===1?'':'s'}`;announce(`${n} attempts match`)}if(t.id==='reject-code'){const has=state.report==='partial'&&route.startsWith('report');$('#reject-results').innerHTML=has&&t.value!=='invalid_json'?rejectTable():`<div class="empty" style="min-height:180px"><h3>${t.value?'No rejects match this code.':'No rejected records.'}</h3><p>${t.value?'Choose All codes to widen the results.':'All records in this fixture were accepted.'}</p></div>`;announce('Reject code filter applied')}if(t.id==='epoch-unit'){state.timeUnit=t.value;state.epoch=t.value==='seconds';state.mappingDirty=true;state.validated=false;state.assistantPreview=false;state.saved=false;render();$('#epoch-unit').focus();announce(state.epoch?'Timestamp unit updated. Revalidate the draft.':'Epoch seconds must be confirmed for this fixture.')}});
document.addEventListener('input',e=>{if(e.target.id==='chat-input')state.chatDraft=e.target.value;if(e.target.dataset.mapField!==undefined){state.mapFields[Number(e.target.dataset.mapField)]=e.target.value;state.mappingDirty=true;state.validated=false;state.assistantPreview=false;state.saved=false;$('#validation-status').textContent='Draft changed · previous preview invalidated';$('#draft-badge').textContent='Draft';$('#draft-description').textContent='Edited locally · preview invalidated';$('[data-draft-preview]')?.remove();$('[data-action="assistant-preview"]').disabled=true;$$('[data-action="save-revision"],[data-action="assistant-import"]').forEach(b=>b.disabled=true);e.target.removeAttribute('aria-invalid');}});
document.addEventListener('submit',e=>{if(e.target.id!=='chat-form')return;e.preventDefault();const t=$('#chat-input').value.trim();if(!t){$('#chat-input').focus();return}if(!state.redaction){action('redaction');return}state.chatDraft='';state.chat.push({role:'user',text:t});const lower=t.toLowerCase();if(lower.includes('second')){state.epoch=true;state.timeUnit='seconds';state.mappingDirty=true;state.validated=false;state.assistantPreview=false;state.saved=false;state.chat.push({role:'assistant',text:'Updated created_at to epoch seconds. This local simulation applies that specific edit to the table; validate before previewing.'})}else state.chat.push({role:'assistant',text:lower.includes('usage')||lower.includes('null')?'Usage maps once per root conversation, not once per turn. Missing values remain null. Inspect the input-token row’s explanation for the accounting assumption.':'This offline conversation supports the “use epoch seconds” correction and usage explanations. Edit a source path directly in the shared table to try validation; no arbitrary instruction has been applied.'});render();$('#chat-input').focus();$('.chatmessages').scrollTop=$('.chatmessages').scrollHeight;announce('Assistant response added');});
document.addEventListener('dragover',e=>{if(e.target.closest('#dropzone')){e.preventDefault();$('#dropzone').classList.add('dragover')}});document.addEventListener('dragleave',e=>{if(e.target.closest('#dropzone'))$('#dropzone').classList.remove('dragover')});document.addEventListener('drop',e=>{if(e.target.closest('#dropzone')){e.preventDefault();$('#dropzone').classList.remove('dragover');uploadExample(e.dataTransfer.files[0])}});
window.addEventListener('hashchange',()=>{if($('#inspector').open)closeDialog();render();$('#main').focus({preventScroll:true});window.scrollTo(0,0)});
render();
</script>
