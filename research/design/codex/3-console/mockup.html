function filters(){const active=['dashboard','session'].includes(state.route);document.getElementById('filters').className=active?'filters':'';document.getElementById('filters').innerHTML=active?`<div class="filter-inner"><span class="filter-label">Scope</span><label class="filter">Source <select aria-label="Source filter" onchange="setFilter('source',this.value)">${opts([['all','All sources'],['tracelab','tracelab'],['swe-chat','swe-chat']],state.source)}</select></label><label class="filter">Agent <select aria-label="Agent filter" onchange="setFilter('agent',this.value)">${opts([['all','All agents'],['claude-code','claude-code'],['codex','codex']],state.agent)}</select></label><label class="filter">Model <select aria-label="Model filter" onchange="setFilter('model',this.value)">${opts([['all','All models'],...models.map(x=>[x,x])],state.model)}</select></label><label class="filter filter-end">Period <select aria-label="Period filter" onchange="setFilter('period',this.value)">${opts([['week','Jun 1–7, 2026'],['day','Jun 4, 2026']],state.period)}</select></label><span class="utc">UTC</span><button class="quiet" onclick="resetFilters()" aria-label="Reset all filters">↺</button></div>`:''}
function setFilter(key,value){state[key]=value;state.page=0;state.day=null;state.view='success';if(state.route==='session')go('dashboard');else render();announce('Scope updated. '+scoped().length+' sessions.')}
function resetFilters(){Object.assign(state,{source:'all',agent:'all',model:'all',period:'week',day:null,tool:null,page:0,view:'success'});go('dashboard');render();announce('Filters cleared.')}
function head(eyebrow,title,subtitle,action=''){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${action}</div>`}
function footer(){return `<div class="state-note"><span>Console / 03 <span aria-hidden="true">·</span> Interactive design study · Illustrative chart distributions</span><button class="link" onclick="reviewStates()">Review states ↗</button></div>`}
function render(){state.route=(location.hash.slice(1).split('?')[0]||'dashboard');if(state.route==='main'){document.getElementById('main').focus();return}filters();document.querySelectorAll('[data-nav]').forEach(a=>{const key=['import','report','imports'].includes(state.route)?'imports':state.route==='session'?'dashboard':state.route;a.toggleAttribute('aria-current',a.dataset.nav===key);if(a.dataset.nav===key)a.setAttribute('aria-current','page')});const screens={dashboard,import:importPage,report,imports:historyPage,session:sessionPage,assistant,definitions};document.getElementById('main').innerHTML=(screens[state.route]||(()=>head('404','This view does not exist.','Return to your data.',`<a class="button" href="#dashboard">Open overview</a>`)))()+footer();document.title='AgentScope — '+({dashboard:'Overview',import:'Import traces',report:'Import report',imports:'Imports',session:'Session',assistant:'Mapping assistant',definitions:'Definitions'}[state.route]||'Console');wireDrop()}
window.addEventListener('hashchange',()=>{state.view='success';render();document.getElementById('main').focus({preventScroll:true});window.scrollTo(0,0)});
function kpi(key,label,value,coverage){return `<section class="panel kpi"><h2 class="kpi-title">${label}<button class="info" onclick="metric('${key}')" aria-label="${label}: definition and coverage">ⓘ</button></h2><div class="kpi-value">${n(value)}</div><div class="kpi-foot"><span class="coverage"></span>${coverage}</div></section>`}
function dashboard(){const rows=scoped(),calls=sum(rows,'calls');let top=head('Workspace analytics','Overview','Recorded activity across imported agent traces.',`<button onclick="refreshData()">↻ Refresh</button>`);if(state.view==='loading')return top+`<div role="status" aria-busy="true"><span class="sr">Loading metrics and sessions</span><div class="kpis">${Array.from({length:4},()=>'<div class="panel panel-body"><div class="skeleton"></div><div class="skeleton" style="width:55%"></div></div>').join('')}</div><div class="panel panel-body"><div class="skeleton" style="height:220px"></div></div></div>`;if(state.view==='error')return top+`<div class="notice error" role="alert"><strong>Metrics could not be loaded.</strong><p>The local server did not respond. Your filters are preserved.</p><button onclick="refreshData()" style="margin-top:12px">Retry request</button></div>`;if(state.view==='empty'||!rows.length)return top+`<section class="panel empty"><div class="empty-symbol">⌁</div><h2>No sessions in this scope</h2><p>${state.source==='swe-chat'?'No SWE-chat observations have been imported in this demo.':'Try a different source, agent, model or period. Your imported data is unchanged.'}</p><button onclick="resetFilters()">Clear filters</button> <a class="button primary" href="#import">Import traces</a></section>`;
const unavailable=state.view==='unavailable';return top+`<div class="kpis">${kpi('sessions','Sessions',rows.length,`${n(rows.length)} / ${n(rows.length)} identities`)}${kpi('calls','Model calls',calls,`${n(calls)} / ${n(calls)} observations`)}${kpi('input','Input tokens',unavailable?null:sum(rows,'input'),`${unavailable?'0':n(calls)} / ${n(calls)} calls · ${unavailable?'no known values':'known values'}`)}${kpi('output','Output tokens',sum(rows,'output'),`${n(calls)} / ${n(calls)} calls · known values`)}</div>
<div class="charts"><section class="panel"><div class="panel-head"><h2>Activity by day</h2><div class="legend"><span><i></i>Sessions</span><button class="info" onclick="chartData('activity')" aria-label="Activity chart data and definition">ⓘ</button></div></div><div class="chart-wrap">${activityChart(rows)}</div><div class="chart-note">Observed start · UTC <span style="float:right">Select a day to explore sessions</span></div></section><section class="panel"><div class="panel-head"><h2>Input tokens by model</h2><button class="info" onclick="chartData('tokens')" aria-label="Token chart data and semantics">ⓘ</button></div>${unavailable?'<div class="empty"><h2>Unavailable</h2><p>No calls have known input usage.</p></div>':models.map((m,i)=>{const value=sum(rows.filter(s=>s.model===m),'input');return `<button class="model-row" onclick="setFilter('model','${m}')"><span>${m}</span><span>${n(value)}</span><svg viewBox="0 0 300 6" preserveAspectRatio="none" aria-hidden="true"><rect width="300" height="6" fill="#eef3f0" rx="2"/><rect width="${value/(Math.max(...models.map(m=>sum(rows.filter(s=>s.model===m),'input')))||1)*300}" height="6" fill="${['#086b58','#486a9a','#a86122'][i]}" rx="2"/></svg></button>`}).join('')}<div class="chart-note" style="margin-top:8px"><button class="link small" onclick="metric('input')">${unavailable?'Coverage details':'2 accounting semantics'} ↗</button></div></section></div>
<div class="quality"><h2><span class="dot"></span>Data quality</h2><button onclick="quality('rejects')"><strong>0</strong> rejects</button><button onclick="quality('usage')"><strong>${unavailable?n(calls):'0'}</strong> missing input usage</button><button onclick="quality('timestamps')"><strong>0</strong> unknown timestamps</button><button onclick="quality('tools')"><strong>0</strong> unlinked tools</button><button onclick="quality('all')" aria-label="View all quality details">Details ↗</button></div>
<div class="chart-bottom"><section class="panel"><div class="panel-head"><h2>Tool observations</h2><span class="muted">${n(sum(rows,'tools'))} total</span></div><div class="chart-wrap">${toolsChart(rows)}</div><div class="chart-note">Select a tool to explore contributing sessions</div></section><section class="panel"><div class="panel-head"><div><h2>Sessions in scope ${state.day?`<span class="badge neutral">Jun ${state.day}</span>`:''}${state.tool?` <span class="badge neutral">${state.tool}</span>`:''}</h2><div class="muted" style="margin-top:3px">${n(rows.length)} sessions · observed intervals, not active time</div></div>${state.day||state.tool?'<button class="link small" onclick="clearDrill()">Clear selection</button>':'<button class="link small" onclick="sessionList()">Expand ↗</button>'}</div>${sessionsTable(rows,false)}</section></div>`}
function activityChart(rows){const values=Array.from({length:7},(_,i)=>rows.filter(s=>s.day===i+1).length),max=Math.max(15,...values);return `<svg viewBox="0 0 650 195" role="group" aria-labelledby="activity-title"><title id="activity-title">Sessions by observed start day. Each bar opens the matching sessions.</title>${[0,5,10,15].map(v=>`<line class="gridline" x1="32" x2="635" y1="${159-v/max*135}" y2="${159-v/max*135}"/><text class="chart-axis" x="9" y="${163-v/max*135}">${v}</text>`).join('')}${values.map((v,i)=>`<g><rect role="button" tabindex="0" class="chart-bar" aria-label="June ${i+1}: ${v} sessions. Filter sessions" x="${53+i*84}" y="${159-v/max*135}" width="40" height="${Math.max(2,v/max*135)}" rx="3" onclick="drillDay(${i+1})" onkeydown="svgKey(event,()=>drillDay(${i+1}))"><title>June ${i+1} · ${v} sessions</title></rect><text class="chart-axis" text-anchor="middle" x="${73+i*84}" y="183">Jun ${i+1}</text></g>`).join('')}</svg>`}
function toolsChart(rows){const totals=toolNames.map(t=>rows.reduce((a,s)=>a+(s.i===0?(['Bash','Read','Agent'].includes(t)?1:0):s.tool===t?s.tools:0),0));return `<svg viewBox="0 0 380 244" role="group" aria-labelledby="tools-title"><title id="tools-title">Tool observation counts. Bars filter sessions by tool.</title>${toolNames.map((t,i)=>`<text class="chart-axis" x="0" y="${24+i*32}">${t}</text><rect class="chart-bar" role="button" tabindex="0" aria-label="${t}: ${n(totals[i])} observations. Filter sessions" x="70" y="${12+i*32}" width="${Math.max(2,totals[i]/(Math.max(...totals)||1)*245)}" height="16" rx="2" onclick="drillTool('${t}')" onkeydown="svgKey(event,()=>drillTool('${t}'))"><title>${t} · ${n(totals[i])}</title></rect><text class="chart-axis" text-anchor="end" x="375" y="${24+i*32}">${n(totals[i])}</text>`).join('')}</svg>`}
function svgKey(event,fn){if(event.key==='Enter'||event.key===' '){event.preventDefault();fn()}}
function drillDay(day){state.day=day;state.page=0;render();announce('June '+day+' selected. '+scoped().length+' matching sessions.');document.querySelector('.chart-bottom .panel:last-child h2')?.scrollIntoView({block:'center',behavior:'smooth'})}
function drillTool(tool){state.tool=tool;state.page=0;render();announce(tool+' selected. '+scoped().length+' matching sessions.')}
function clearDrill(){state.day=null;state.tool=null;state.page=0;render()}
function sessionsTable(rows,full){const page=state.page,shown=rows.slice(page*5,page*5+5);return `<div class="table-wrap"><table><caption class="sr">${full?'Contributing sessions':'Sessions in current chart and filter scope'}</caption><thead><tr><th>Session / repository</th><th>Agent</th><th class="num">Calls</th><th class="num">Input tokens</th></tr></thead><tbody>${shown.map(s=>`<tr><td><a href="#session" onclick="selectSession(${s.i})">${s.i===0?'781a3b4c':String(s.ext).slice(-8)} <span aria-hidden="true">↗</span></a><div class="secondary">${s.repo}</div></td><td>${s.agent}<div class="secondary">Jun ${s.day}, 02:51 UTC</div></td><td class="num">${n(s.calls)}</td><td class="num">${state.view==='unavailable'?'Unavailable':n(s.input)}<div class="secondary">${state.view==='unavailable'?'0':s.calls} / ${s.calls} known</div></td></tr>`).join('')}</tbody></table></div><div class="table-foot"><span>${Math.min(page*5+1,rows.length)}–${Math.min(page*5+5,rows.length)} of ${rows.length}</span><div class="row"><button ${page===0?'disabled':''} onclick="pageSessions(-1,${full})" aria-label="Previous sessions page">←</button><button ${(page+1)*5>=rows.length?'disabled':''} onclick="pageSessions(1,${full})" aria-label="Next sessions page">→</button></div></div>`}
function pageSessions(delta,full){state.page+=delta;if(full)sessionList();else render()}
function selectSession(i){state.session=i;state.sessionTab='model';state.obsPage=0;closeDialog()}
function sessionList(){showDialog('Contributing sessions',`<p class="muted small">The same source, agent, model and period filters apply.</p><div style="margin-top:20px">${sessionsTable(scoped(),true)}</div>`)}
function metric(key){if(key==='session-input'){sessionMetric();return}const rows=scoped(),calls=sum(rows,'calls'),data={sessions:['Sessions',rows.length,'Distinct session identities in scope. An identity is scoped by source and harness; matching native IDs across exports are not automatically merged.',`${rows.length} / ${rows.length} identities`,'sessions'],calls:['Model calls',calls,'Recorded model-call observations in scope. This is a count of imported observations, not a claim of unique provider requests.',`${n(calls)} / ${n(calls)} observations`,'observations'],input:['Input tokens',state.view==='unavailable'?null:sum(rows,'input'),'Sum of known input_tokens on model-call observations. Missing values do not become zero. The total combines reported counts with different accounting semantics.',`${state.view==='unavailable'?'0':n(calls)} / ${n(calls)} model calls`,'tokens'],output:['Output tokens',sum(rows,'output'),'Sum of known output_tokens on model-call observations in scope. Reasoning output is included only where the source contract says so.',`${n(calls)} / ${n(calls)} model calls`,'tokens']}[key];showDialog(data[0],`<div class="eyebrow">Metric definition</div><p class="metric-description">${data[2]}</p><div class="metric-large">${n(data[1])}</div><p class="muted small">${data[4]} · coverage ${data[3]}</p>${['input','output'].includes(key)?`<div class="separate"><h3>Accounting semantics</h3><dl class="detail-list"><dt>tracelab-claude</dt><dd>${key==='input'&&state.view==='unavailable'?'Unavailable':n(sum(rows.filter(s=>s.agent==='claude-code'),key))} tokens</dd><dt>tracelab-codex</dt><dd>${key==='input'&&state.view==='unavailable'?'Unavailable':n(sum(rows.filter(s=>s.agent==='codex'),key))} tokens</dd></dl><div class="notice">Compare within a semantics tag. Cache read tokens are known only for tracelab-claude; do not infer cross-provider efficiency from these sums.</div></div>`:''}<div class="actions"><a href="#definitions" onclick="closeDialog()">All definitions</a><button class="primary" onclick="sessionList()">Contributing sessions →</button></div>`)}
function chartData(kind){const rows=scoped();showDialog(kind==='activity'?'Activity by day':'Input tokens by model',`<p class="muted small">${kind==='activity'?'Distinct sessions bucketed by observed start, UTC. Unknown starts are excluded and counted in Data quality.':'Sum of known input tokens, grouped by model. The values below are exact; comparisons require matching accounting semantics.'}</p><table style="margin-top:20px"><caption>Accessible chart data · illustrative distribution</caption><thead><tr><th>${kind==='activity'?'Day, June 2026':'Model'}</th><th class="num">${kind==='activity'?'Sessions':'Tokens'}</th></tr></thead><tbody>${(kind==='activity'?Array.from({length:7},(_,i)=>[i+1,rows.filter(s=>s.day===i+1).length]):models.map(m=>[m,sum(rows.filter(s=>s.model===m),'input')])).map(([label,value])=>`<tr><td>${label}</td><td class="num">${state.view==='unavailable'&&kind!=='activity'?'Unavailable':n(value)}</td></tr>`).join('')}</tbody></table><div class="actions"><a href="#definitions" onclick="closeDialog()">Read definitions →</a></div>`)}
function quality(kind){showDialog('Data quality',`<p class="muted small">Current scope · quality counts below are illustrative. Import field warnings are separate from missing metric coverage.</p><dl class="detail-list"><dt>Rejected records</dt><dd>0 · no failed record emissions in the fixture</dd><dt>Missing input usage</dt><dd>${state.view==='unavailable'?n(sum(scoped(),'calls')):'0'} model calls</dd><dt>Unknown timestamps</dt><dd>0 sessions excluded from activity</dd><dt>Unlinked tools</dt><dd>0 tool observations without a model-call link</dd></dl><h3>Import field warnings</h3><p class="subtitle">11,168 explicit nulls · 14,633 absent fields</p><p class="small muted" style="margin-top:10px">These are field occurrences, not rejected records. One source record may contribute several warnings.</p><div class="actions"><button onclick="state.report='committed';state.swe=false;openRoute('report')">Open import report →</button></div>`)}
function refreshData(){state.view='loading';render();announce('Loading metrics and sessions.');setTimeout(()=>{state.view='success';render();announce('Overview updated.')},750)}
function importPage(){return `<div class="narrow">${head('Ingestion','Import traces','Choose a file, inspect its mapping, then commit its observations.',`<a class="button" href="#imports">Import history</a>`)}<div class="two-col"><div class="stack"><section class="panel"><div class="panel-head"><h2>Source file</h2><span class="badge neutral">Local bytes</span></div><div class="panel-body" style="padding-top:0"><div class="drop" id="drop"><div><div class="drop-icon" aria-hidden="true">↥</div><label class="button" for="file">Choose a trace file</label><input class="sr" type="file" id="file" accept=".jsonl,.gz,.parquet" onchange="chooseFile(this.files[0])"><p class="small muted">or drop it here · JSONL, JSONL.gz, Parquet</p><p class="small muted">Up to 25 MiB and 100,000 records per batch</p></div></div>${state.file?`<div class="file-row"><span class="file-icon" aria-hidden="true">{ }</span><div><strong>${state.swe?'swe-chat-conversations.parquet':esc(state.fileName)}</strong><div class="small muted">${state.swe?'Parquet · 2,000 excerpt rows · illustrative upload':'JSONL · gzip detected · 681,057 bytes · 4,770 records'}</div></div><button class="quiet" style="margin-left:auto" onclick="removeFile()" aria-label="Remove selected file">×</button></div>${!state.swe?`<div class="notice"><strong>These bytes were imported before.</strong><p>Same source + same bytes will add no observations.</p><button class="link" onclick="priorImport()">1 earlier import · Sep 7, 10:00 UTC ↗</button></div>`:'<div class="notice good">Excerpt selected. The 1.3 GB upstream file exceeds the 25 MiB limit.</div>'}`:`<p class="small muted" style="margin-top:15px">No file selected. <button class="link small" onclick="loadFixture()">Use TraceLab demo fixture</button></p>`}</div></section>${state.file?`<section class="panel"><div class="panel-head"><h2>Mapping</h2><button class="link small" onclick="mappingDetails()">Inspect revision ↗</button></div><div class="panel-body" style="padding-top:0"><label class="field">Apply saved mapping<select onchange="changeMapping(this.value)">${opts([[state.swe?'swe-chat-v1':'tracelab-v1',state.swe?'swe-chat-v1 · revision 1':'tracelab-v1 · revision 1'],['unknown','Create a mapping…']],state.mapping)}</select><span class="field-help">${state.swe?'Reviewed proposal':'Bundled contract'} · ${state.swe?'swe-chat':'tracelab'} namespace</span></label><div class="actions"><span class="muted">Preview writes no observations.</span><button class="primary" onclick="previewImport()">${state.preview?'Refresh preview':'Preview 200 records'} →</button></div></div></section>`:''}${state.preview?previewPanel():''}</div><aside class="panel"><div class="panel-body"><h2>Before you commit</h2><p class="subtitle">The preview applies your mapping to a sample. Only your confirmation starts the full import.</p><div class="insight">One record may emit a session contribution, a model call and several tool calls.</div><div class="separate"><h3>Unknown structure?</h3><p class="subtitle">Profile the fields and review a proposed mapping.</p><a class="button" style="margin-top:14px" href="#assistant">Open mapping assistant →</a></div></div></aside></div></div>`}
function loadFixture(){Object.assign(state,{file:true,swe:false,fileName:'tracelab-sample.jsonl.gz',mapping:'tracelab-v1',preview:false});render()}
function removeFile(){state.file=false;state.preview=false;render();announce('File removed.')}
function wireDrop(){const el=document.getElementById('drop');if(!el)return;el.ondragover=e=>{e.preventDefault();el.classList.add('drag')};el.ondragleave=()=>el.classList.remove('drag');el.ondrop=e=>{e.preventDefault();el.classList.remove('drag');chooseFile(e.dataTransfer.files[0])}}
function chooseFile(file){if(!file)return;if(file.size>25*1024*1024){showDialog('File exceeds the import limit',`<div class="notice error" role="alert"><strong>${esc(file.name)}</strong><p>${n(file.size)} bytes exceeds 25 MiB. Create an excerpt of at most 25 MiB and 100,000 rows, then choose that file.</p></div>`,true);return}if(!/\.(jsonl|gz|parquet)$/i.test(file.name)){showDialog('Unsupported file type','<div class="notice error" role="alert">Choose a JSONL, JSONL.gz or Parquet file.</div>',true);return}showDialog('Local prototype',`<p>This self-contained study does not parse or upload files. The file you selected stays on your device.</p><p class="muted">Continue with the supplied TraceLab fixture to explore sniffing, preview and confirmation.</p><div class="actions"><button class="primary" onclick="closeDialog();loadFixture()">Use demo fixture</button></div>`,true)}
function changeMapping(value){state.preview=false;if(value==='unknown'){go('assistant');return}state.mapping=value;render();announce('Mapping changed. Preview invalidated.')}
function previewImport(){toast('Running sample preview…');announce('Preview running. No writes.');setTimeout(()=>{state.preview=true;render();announce('Preview ready. 200 accepted records, no rejects.');document.getElementById('preview-panel')?.scrollIntoView({block:'center',behavior:'smooth'})},550)}
function previewPanel(){return `<section class="panel" id="preview-panel"><div class="panel-head"><h2>Preview ready</h2><span class="badge">200 / 200 accepted</span></div><div class="panel-body" style="padding-top:0"><p class="small muted">First 200 of ${state.swe?'2,000':'4,770'} records · illustrative sample results</p><div class="count-grid"><div class="count"><strong>${state.swe?'200':'12'}</strong><span>Sessions</span></div><div class="count"><strong>200</strong><span>Model calls</span></div><div class="count"><strong>${state.swe?'0':'241'}</strong><span>Tool calls</span></div></div><div class="row spread separate"><button class="link small" onclick="previewDetails('warnings')">${state.swe?'0 warnings':'468 null · 613 absent'} ↗</button><button class="link small" onclick="previewDetails('rejects')">0 rejects ↗</button><button class="link small" onclick="previewDetails('emissions')">Emissions sample ↗</button></div><div class="actions"><span class="muted">The full run may produce different outcomes.</span><button class="primary" onclick="confirmImport()">Review &amp; commit →</button></div></div></section>`}
function priorImport(){showDialog('Earlier import of these bytes',`<span class="badge">Committed</span><dl class="detail-list"><dt>Import</dt><dd class="mono">${IMP}</dd><dt>Time</dt><dd>2026-09-07T10:00:00Z</dd><dt>Source</dt><dd>tracelab</dd><dt>Mapping</dt><dd>tracelab-v1 · revision 1</dd></dl><h3>File SHA-256</h3><div class="hash" style="margin-top:10px">${HASH}</div><div class="actions"><button onclick="state.report='committed';openRoute('report')">Open report →</button></div>`)}
function mappingDetails(swe=state.swe){showDialog('Mapping revision',`<span class="badge neutral">Immutable revision</span><dl class="detail-list"><dt>Name</dt><dd>${swe?'swe-chat-v1':'tracelab-v1'}</dd><dt>Revision</dt><dd>1</dd><dt>Mapping ID</dt><dd class="mono">${swe?'map_demo_swe_revision_1':MAP}</dd><dt>Input</dt><dd>${swe?'parquet':'jsonl'}</dd><dt>Created by</dt><dd>${swe?'Analyst · reviewed proposal':'Bundled contract'}</dd></dl><h3>Rules</h3><p class="subtitle">Root → session contribution<br>Root → model-call observation<br>Tools array → linked tool-call observations</p><p class="subtitle">Source occurrence identity uses file hash, record locator and emission path. Native IDs do not silently deduplicate observations.</p>`)}
function previewDetails(kind){const text={warnings:'<h3>Field occurrences</h3><dl class="detail-list"><dt>Explicit null</dt><dd>468</dd><dt>Absent key</dt><dd>613</dd></dl><p class="muted small">Optional values are missing. Accepted records may have several field warnings; these counts are not records.</p>',rejects:'<div class="empty"><div class="empty-symbol">✓</div><h2>No rejects in the sample</h2><p>All 200 sampled records were accepted. The full run still validates every record.</p></div>',emissions:`<p class="muted small">Illustrative emission · line:1 · rule model_call</p><pre>{\n  "entity": "model_call",\n  "path": "model_call",\n  "locator": "line:1",\n  "fields": {\n    "model": "claude-opus-4-6",\n    "input_tokens": 16147\n  }\n}</pre>`};showDialog('Preview · '+kind,text[kind])}

async function copyRaw(){try{await navigator.clipboard.writeText(window.rawText);toast('Source JSON copied.')}catch{const range=document.createRange();range.selectNodeContents(document.querySelector('#dialog-body pre'));const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);toast('JSON selected. Press Control+C or Command+C to copy.')}}
function assistant(){return head('Mapping assistant','Make the unfamiliar observable.','swe-chat-conversations.parquet · 2,000-row excerpt of a 1.3 GB upstream file',`<span class="badge ${state.saved?'':'neutral'}">${state.saved?'Revision 1 saved':state.proposal?'Unsaved proposal':'Local field profile'}</span>`)+`<div class="assistant-grid"><div class="stack"><section class="panel"><div class="panel-head"><h2>${state.proposal?'Proposed mapping':'Field profile'}</h2><button class="link small" onclick="profileDetails()">${state.proposal?'View field profile':'Sampling details'} ↗</button></div>${!state.proposal?`<div class="panel-body" style="padding-top:0"><p class="small muted">Profiled locally · 2,000 rows · no content sent</p>${[['conversation_id','string · 2,000 / 2,000'],['turns[]','array · role, content, tool_calls[]'],['model','string · 2,000 / 2,000'],['usage.prompt_tokens','integer · 1,982 / 2,000'],['usage.completion_tokens','integer · 1,982 / 2,000'],['created_at','integer · epoch seconds'],['repo','string · 1,964 / 2,000']].map(([name,type])=>`<div class="profile-row"><code>${name}</code><span class="muted">${type}</span></div>`).join('')}<div class="actions"><span class="muted">Model suggestions require your review.</span><button class="primary" onclick="privacy()">Review &amp; propose →</button></div></div>`:mappingTable()}</section>${state.proposal?`<section class="panel"><div class="panel-head"><h2>Review before previewing</h2><span class="badge ${state.usageResolved&&state.toolsResolved?'':'warn'}">${2-Number(state.usageResolved)-Number(state.toolsResolved)} ambiguities</span></div><div class="panel-body" style="padding-top:0"><div class="riskline"><span class="badge ${state.usageResolved?'':'warn'}">${state.usageResolved?'✓':'1'}</span><div><h3>Does usage describe a turn or a conversation?</h3><p class="subtitle">A conversation-level value must not be repeated for every turn.</p><button class="link small" onclick="resolveUsage()">${state.usageResolved?'Resolved: one model-call observation per conversation':'Use one model-call observation per conversation'} ↗</button></div></div><div class="riskline"><span class="badge ${state.toolsResolved?'':'warn'}">${state.toolsResolved?'✓':'2'}</span><div><h3>Tool calls have no reliable model-call parent.</h3><p class="subtitle">Exclude tool emissions until a parent relationship is validated.</p><button class="link small" onclick="resolveTools()">${state.toolsResolved?'Resolved: tool emissions excluded, reason retained':'Exclude tools and record the limitation'} ↗</button></div></div><div class="actions"><span class="muted" id="map-status">${state.mapPreview?'Preview valid · current draft':state.saved?'Editing creates a new draft':'Edits invalidate the preview'}</span><button onclick="validateMapping()">Validate</button><button class="primary" ${!state.usageResolved||!state.toolsResolved?'disabled':''} onclick="previewMapping()">Preview →</button></div>${state.mapPreview?`<div class="notice good" style="margin-top:18px"><strong>Sample preview passed</strong><p>200 accepted · 0 rejected · 200 session contributions · 200 model calls · 0 tool calls. Illustrative sample; full excerpt may differ.</p><button class="link" onclick="saveMapping()">${state.saved?'Revision 1 saved ✓':'Save as revision 1'} →</button></div>`:''}${state.saved?'<div class="actions"><button class="primary" onclick="assistantImport()">Import with this revision →</button></div>':''}</div></section>`:''}</div><aside class="stack"><section class="panel"><div class="panel-body"><div class="eyebrow">Your data boundary</div><h2>Profile first. Content stays local.</h2><p class="subtitle">Only field names, types, counts and the reviewed mapping are shared with the configured provider.</p><button class="link small" style="margin-top:10px" onclick="privacy()">Inspect what leaves the machine ↗</button></div></section><section class="panel"><div class="panel-head"><h2>Mapping conversation</h2><span class="badge neutral">${state.proposal?'Proposal ready':'Not started'}</span></div><div class="panel-body" style="padding-top:0"><p class="small muted">${state.proposal?'The proposal is editable. Nothing is imported until you confirm.':'Review the outbound context to request the first proposal.'}</p>${state.proposal?`<div class="chat"><strong>Assistant</strong>I found conversation-level usage and nested tool calls. Please resolve the two identity and linking questions before previewing.</div>${state.chats.map(c=>`<div class="chat ${c.role==='You'?'user':''}"><strong>${c.role}</strong>${esc(c.text)}</div>`).join('')}<form class="composer" onsubmit="event.preventDefault();sendChat()"><label class="sr" for="chat-input">Message to mapping assistant</label><textarea id="chat-input" placeholder="Ask about a field or revise the proposal…" required></textarea><div class="row spread" style="margin-top:8px"><span class="small muted">Demo conversation</span><button type="submit">Send ↑</button></div></form>`:''}</div></section></aside></div>`}
function mappingTable(){return `<div class="table-wrap"><table><caption>Editable draft · choose a field explanation to review its rationale</caption><thead><tr><th>Target field</th><th>Source path</th><th>Transform</th><th><span class="sr">Explanation</span></th></tr></thead><tbody>${fields.filter((f,i)=>!(i===6&&state.toolsResolved)).map((f,i)=>`<tr><td><code>${f[0]}</code></td><td><input class="mapping-input" aria-label="Source path for ${f[0]}" value="${esc(f[1])}" oninput="editField(${i},this)"><div class="validation" id="val-${i}" aria-live="polite"></div></td><td class="small">${f[2]}</td><td><button class="info" onclick="explainField(${i})" aria-label="Explain ${f[0]}">ⓘ</button></td></tr>`).join('')}</tbody></table></div>`}
function editField(i,input){fields[i][1]=input.value;state.mapPreview=false;state.saved=false;const valid=/^\$\.[A-Za-z_][\w.\[\]*]*$/.test(input.value);input.setAttribute('aria-invalid',String(!valid));document.getElementById('val-'+i).textContent=valid?'':'Use a rooted path, e.g. $.model';const badge=document.querySelector('.page-head > .badge');if(badge){badge.textContent='Unsaved proposal';badge.className='badge neutral'}const status=document.getElementById('map-status');if(status)status.textContent='Draft changed · preview invalidated';document.querySelectorAll('.notice.good').forEach(x=>x.remove());document.querySelectorAll('button').forEach(b=>{if(b.textContent.includes('Import with this revision'))b.remove()})}
function explainField(i){const explanations=['Scope conversation_id by swe-chat and the declared harness. Do not use the model label as an agent identity.','Preserve the source model string. No alias or provider inference is applied.','Strict non-negative integer. Preserve missing values as null. Confirm whether usage belongs to a turn or the whole conversation.','Strict non-negative integer. Use swe-chat-conversation-v1 semantics. It is not comparable with a per-turn token count.','Interpret integer epoch seconds, then convert to a UTC timestamp. Never interpret this field as milliseconds.','Preserve repo as supplied. Missing values remain unavailable; no repository inference.','Nested tool arrays require a validated parent relationship. Until that is known, do not emit tool observations.'];showDialog(fields[i][0],`<div class="eyebrow">Field explanation</div><p class="metric-description">${explanations[i]}</p><dl class="detail-list"><dt>Source path</dt><dd class="mono">${esc(fields[i][1])}</dd><dt>Transform</dt><dd>${fields[i][2]}</dd><dt>Proposal origin</dt><dd>Configured compatible provider · illustrative response</dd></dl><p class="small muted">This is a declarative field mapping. Generated code and arbitrary expressions are not allowed.</p>`)}
function profileDetails(){showDialog('Local field profile',`<p class="muted small">2,000-row excerpt · Parquet · bounded profiling. Counts are illustrative.</p><dl class="detail-list"><dt>conversation_id</dt><dd>2,000 present · 2,000 distinct</dd><dt>turns[]</dt><dd>Nested role, content, tool_calls[]</dd><dt>model</dt><dd>2,000 present</dd><dt>usage.prompt_tokens</dt><dd>1,982 integer · 18 absent</dd><dt>usage.completion_tokens</dt><dd>1,982 integer · 18 absent</dd><dt>created_at</dt><dd>2,000 integer · epoch seconds</dd><dt>repo</dt><dd>1,964 string · 36 absent</dd></dl><div class="notice">The 1.3 GB upstream file is not uploadable in v0.1. Use an excerpt under 25 MiB and 100,000 records.</div>`)}
function privacy(){showDialog('Review outbound context',`<span class="badge neutral">No request sent yet · local simulation</span><p class="subtitle">Destination: your configured OpenAI-compatible provider. No provider is connected in this mockup.</p><dl class="detail-list"><dt>Included</dt><dd>Field names, inferred types, presence counts, array structure, current draft mapping and your conversation message.</dd><dt>Excluded</dt><dd>Prompt and response content, repository values, conversation IDs, tool arguments and credentials. No raw rows are sent in this profile-only proposal.</dd></dl><details><summary>Exact profile payload</summary><pre>${esc(JSON.stringify({rows:2000,fields:{conversation_id:{type:'string',present:2000},turns:{type:'array',children:['role','content','tool_calls[]']},model:{type:'string',present:2000},'usage.prompt_tokens':{type:'integer',present:1982},'usage.completion_tokens':{type:'integer',present:1982},created_at:{type:'integer',unit:'epoch_seconds'},repo:{type:'string',present:1964}},sample:[],redaction:'profile_only'},null,2))}</pre></details><p class="small muted" style="margin-top:15px">Before sending a conversation message, review it for sensitive values. The model can propose a mapping; only your import confirmation can write observations.</p><div class="actions"><button onclick="closeDialog()">Keep local</button><button class="primary" onclick="requestProposal()">${state.proposal?'Return to proposal':'Send profile & request proposal'} →</button></div>`,true)}
function requestProposal(){closeDialog();if(state.proposal)return;toast('Generating a mapping proposal…');announce('Mapping proposal pending.');setTimeout(()=>{state.proposal=true;render();announce('Proposal ready with two ambiguities.')},800)}
function resolveUsage(){state.usageResolved=true;state.mapPreview=false;state.saved=false;render();announce('Usage scope resolved. One observation per conversation.')}
function resolveTools(){state.toolsResolved=true;state.mapPreview=false;state.saved=false;render();announce('Tool emissions excluded. Limitation recorded.')}
function validateMapping(){const invalid=fields.find((f,i)=>!(i===6&&state.toolsResolved)&&!/^\$\.[A-Za-z_][\w.\[\]*]*$/.test(f[1]));if(invalid){toast('Validation failed: '+invalid[0]+' needs a rooted source path.');return false}if(!state.usageResolved||!state.toolsResolved){toast('Field syntax is valid. Resolve both ambiguities before previewing.');return false}toast('Schema and semantic checks passed in this demonstration.');return true}
function previewMapping(){if(!validateMapping())return;state.mapPreview=true;render();announce('Preview passed. Save a revision to continue.')}
function saveMapping(){if(!state.mapPreview||!validateMapping())return;state.saved=true;render();toast('Saved immutable revision 1 in this demo.')}
function assistantImport(){if(!state.saved)return;Object.assign(state,{swe:true,file:true,mapping:'swe-chat-v1',preview:false});go('import')}
function sendChat(){const box=document.getElementById('chat-input'),msg=box.value.trim();if(!msg)return;state.chats.push({role:'You',text:msg});if(/conversation|whole/i.test(msg)){state.usageResolved=true;state.mapPreview=false;state.saved=false;state.chats.push({role:'Assistant',text:'Revised: usage is recorded once per conversation with swe-chat-conversation-v1 semantics. Tool linking still needs a separate decision.'})}else if(/exclude.*tool|skip.*tool/i.test(msg)){state.toolsResolved=true;state.mapPreview=false;state.saved=false;state.chats.push({role:'Assistant',text:'Revised: tool emissions are excluded and the unsupported path is documented. Revalidate and preview this draft.'})}else{state.chats.push({role:'Assistant',text:'This offline demo supports “usage is per conversation” and “exclude tools”. For other revisions, edit a source path directly or inspect its explanation.'})}render();announce('Assistant response added.');document.getElementById('chat-input')?.focus()}
function definitions(){const defs=[['Sessions','count · identity','Distinct session identities in scope, scoped by source and harness. Equal native IDs across unrelated sources are not proof of identity.'],['Model calls','count · observations','Recorded model-call observations. Source occurrences use file hash, locator and emission path. Overlapping exports are not universally reconciled.'],['Input tokens','tokens · known values','Sum of known input_tokens with known / total model-call coverage. Coverage 0 means Unavailable. Compare within token_semantics; combined totals are descriptive only.'],['Output tokens','tokens · known values','Sum of known output_tokens with known / total coverage. Reasoning output inclusion depends on the source contract. Missing is never zero.'],['Cache read tokens','tokens · tracelab-claude','Known only for tracelab-claude accounting semantics. Do not substitute cache reads for total input or compare absent codex cache data as zero.'],['Activity by day','sessions · observed start','Distinct sessions bucketed by observed_start_at in UTC. Unknown starts are excluded and reported separately. Period filters use observed start consistently.'],['Tokens by model','tokens · model + semantics','Known input usage grouped by source model label. Inspect semantics before comparing models; do not infer cost or efficiency.'],['Tool counts','count · observations','Recorded tool-call observations by tool_name. Unlinked tools still count; their missing parent is disclosed in data quality.'],['Observed span','milliseconds · derived interval','Observed end minus observed start from accepted child timestamps. Not active time. Unavailable if either bound is missing; reversed intervals are diagnosed.'],['Data quality','counts · scoped diagnostics','Rejects count source-record failures; missing input usage counts model calls without input usage; unknown timestamps count sessions without observed start; unlinked tools count tool calls without model-call parent. Rejection scope needs an explicit import-to-session policy.'],['Import outcomes','records · exclusive outcomes','Accepted, partial, duplicate, rejected and ignored count source records once. Entity counts count emitted observations separately. Null and absent warnings count field occurrences.']];return head('Reference','Definitions','Units, coverage and comparability rules travel with every metric.',`<a class="button" href="#dashboard">Back to overview</a>`)+`<div class="panel">${defs.map(([title,tags,desc])=>`<section class="definition"><div><h2>${title}</h2><span class="badge neutral">${tags}</span></div><p>${desc}</p></section>`).join('')}</div>`}
function reviewStates(){showDialog('Review prototype states',`<p class="muted small">Design review controls. These simulate resource states and do not alter source data.</p><div class="state-options"><button onclick="demoState('success')">Overview · populated</button><button onclick="demoState('empty')">Overview · empty scope</button><button onclick="demoState('loading')">Overview · loading</button><button onclick="demoState('error')">Overview · request error</button><button onclick="demoState('unavailable')">Overview · coverage zero</button><button onclick="demoReport('committed')">Report · committed</button><button onclick="demoReport('duplicate')">Report · duplicate</button><button onclick="demoReport('running')">Report · running</button><button onclick="demoReport('failed')">Report · failed</button><button onclick="demoReport('reject-demo')">Report · reject browser</button><button onclick="closeDialog();state.proposal=false;state.saved=false;state.mapPreview=false;state.usageResolved=false;state.toolsResolved=false;go('assistant');render()">Assistant · start again</button><button onclick="openRoute('definitions')">Definitions · screen 7</button></div>`,true)}
function demoState(view){closeDialog();state.view=view;if(state.route!=='dashboard'){location.hash='dashboard';setTimeout(()=>{state.view=view;render()},0)}else render();announce('Demonstration state: '+view)}
function demoReport(status){closeDialog();state.report=status;state.swe=false;go('report');render()}
document.addEventListener('keydown',e=>{if(e.target.getAttribute('role')==='tab'&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();sessionTab(e.key==='Home'?'model':e.key==='End'?'tool':state.sessionTab==='model'?'tool':'model')}});
render();
</script>
</body>
</html>
