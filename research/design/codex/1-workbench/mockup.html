];
function mappingPage(){return heading('Mapping workbench','swe-chat-conversations.parquet · 2,000-row excerpt',`<button onclick="profileInspector()">Field profile</button><button onclick="mappingPreview()" ${!state.mapValid?'disabled':''}>Preview</button><button class="primary" onclick="saveRevision()" ${!state.mapPreview||state.mapSaved?'disabled':''}>${state.mapSaved?'Revision 1 saved':'Save revision'}</button>`)+`<div class="notice" style="margin-bottom:18px">${icon('info')}<div class="grow"><strong>Only reviewed context leaves your machine.</strong><p>Field paths, types and counts. Content, tool arguments, repo and identifiers are excluded.</p></div><button class="link small" onclick="redactionInspector()">Review context →</button></div><div class="mapping-grid"><section class="panel"><div class="panelhead"><div class="row"><span class="pill good">Draft</span><h2>swe-chat-v1</h2></div><span class="small muted">DSL v1 · ${state.mapSaved?'immutable revision 1':'unsaved'}</span></div><div class="mapping-alert"><span>${state.mapResolved?'Usage scope resolved · per-call usage stays unknown':'1 ambiguity · does usage describe a turn or a conversation?'}</span><button class="link small" onclick="mappingExplanation(3)">${state.mapResolved?'Details':'Resolve'} →</button></div><table class="map-table"><caption class="sr-only">Editable mapping proposal with per-field explanations</caption><thead><tr><th scope="col" style="width:35%">Target field</th><th scope="col" style="width:39%">Source path</th><th scope="col" style="width:20%">Transform</th><th scope="col" style="width:6%"><span class="sr-only">Explanation</span></th></tr></thead><tbody>${mapFields.map((f,i)=>`<tr class="${state.mapErrors?.[i]?'map-row-invalid':''}"><td><span class="mono" style="font-size:10px">${f.target}</span><div class="table-sub">${f.type}${state.mapResolved&&(i===3||i===4)?' · unsupported source scope':''}</div></td><td><input ${state.mapSaved?'disabled':''} aria-label="Source path for ${f.target}" ${state.mapErrors?.[i]?'aria-invalid="true" aria-describedby="field-error-'+i+'"':''} value="${esc(f.path)}" oninput="editMapping(${i},'path',this.value)">${state.mapErrors?.[i]?`<div class="inline-error" id="field-error-${i}">${state.mapErrors[i]}</div>`:''}</td><td><select ${state.mapSaved?'disabled':''} aria-label="Transform for ${f.target}" onchange="editMapping(${i},'transform',this.value)">${[...new Set([f.transform,'identity','strict_int','epoch_seconds','epoch_ms'])].map(t=>`<option ${f.transform===t?'selected':''}>${t}</option>`).join('')}</select></td><td><button class="link" onclick="mappingExplanation(${i})" aria-label="Explanation for ${f.target}">ⓘ</button></td></tr>`).join('')}</tbody></table><div class="sheetfooter"><span class="small muted" id="mapping-validity" role="status">${state.mapSaved?'Revision 1 saved. Preview matches this revision.':state.mapValid?'Schema and semantics valid. Preview required.':state.mapErrors?.some(Boolean)?'Validation failed. Fix the highlighted fields.':'Proposal only. Review and validate before preview.'}</span><button onclick="validateMapping()" ${state.mapSaved?'disabled':''}>Validate</button></div>${state.mapSaved?'<div class="panelbody"><button class="primary" onclick="confirmSwe()">Review & import excerpt →</button></div>':''}</section><aside class="panel assistant-panel"><div class="panelhead"><div class="row">${icon('spark')}<h2>Mapping assistant</h2></div><span class="pill">Proposal</span></div><div class="panelbody"><div class="caps">Review conversation</div><div class="message"><strong>Proposed 8 field bindings</strong>I can identify sessions and assistant turns. <b>Usage is at the conversation root.</b> Applying it to every turn would multiply token totals.<p>Should we leave per-call usage unknown?</p><button class="link small" style="margin-top:10px" onclick="resolveUsage()" ${state.mapResolved?'disabled':''}>${state.mapResolved?'Applied to draft':'Keep per-call usage unknown'} ${icon('arrow')}</button></div>${state.chat.map(m=>`<div class="message ${m.role==='user'?'user':''}"><strong>${m.role==='user'?'You':'Assistant · simulated'}</strong>${esc(m.text)}</div>`).join('')}</div><form class="composer" onsubmit="event.preventDefault();sendMessage()"><label for="chat-input" class="field-label">Revise the proposal</label><textarea id="chat-input" placeholder="e.g. created_at is milliseconds" ${state.mapSaved?'disabled':''}></textarea><button type="submit" ${state.mapSaved?'disabled':''}>Review & send ${icon('arrow')}</button><p class="small muted" style="margin-top:8px">The assistant proposes. You validate and import.</p></form></aside></div><p class="footer-note">1.3 GB upstream file exceeds the 25 MiB limit. This workbench uses an illustrative local excerpt, 2,000 rows. No provider is contacted in this prototype.</p>`}
function invalidateMapping(){state.mapValid=false;state.mapPreview=false;state.mapSaved=false;const el=$('#mapping-validity');if(el)el.textContent='Draft changed. Validation and preview invalidated.';if(route()==='mapping')$$('.pagehead button').forEach(b=>{if(b.textContent==='Preview'||b.textContent==='Save revision')b.disabled=true})}
function editMapping(i,key,val){mapFields[i][key]=val;invalidateMapping()}
function validateMapping(){state.mapErrors=mapFields.map((f,i)=>!/^\$\.[a-zA-Z_][a-zA-Z0-9_.\[\]*]*$/.test(f.path)?'Use a field path beginning with $.':f.path!==['$.conversation_id','$.turns[*]','$.model','$.usage.prompt_tokens','$.usage.completion_tokens','$.created_at','$.repo','$.turns[*].tool_calls[*]'][i]?'Path not found in the field profile.':i===5&&!['epoch_seconds','epoch_ms'].includes(f.transform)?'A datetime requires an epoch transform.':f.type==='string'&&f.transform!=='identity'?'Transform must preserve a string.':f.type==='array'&&!['assistant_only','bounded_each'].includes(f.transform)?'Use bounded array expansion.':f.type==='integer'&&!['strict_int','identity','unsupported'].includes(f.transform)?'Transform must produce an integer.':null);const errors=state.mapErrors.filter(Boolean);state.mapValid=errors.length===0&&state.mapResolved;render();if(errors.length){announce(`${errors.length} validation errors`);$('.map-row-invalid input')?.focus()}else if(!state.mapResolved){toast('Resolve the usage ambiguity before validation can pass.');mappingExplanation(3)}else{toast('Schema and semantics valid. Preview the current draft.')}}
function mappingExplanation(i){const f=mapFields[i];openInspector(f.target,`<p>${f.why}</p><h3>Proposed binding</h3><pre>${esc(f.path)}\n→ ${esc(f.transform)}\n→ ${f.target}</pre>${i===3||i===4?`<h3>Ambiguity · accounting scope</h3><p>Conversation-level usage cannot be allocated to individual calls without additional evidence. Preserve the raw values and mark the corresponding per-call metric unavailable.</p><div class="actions"><button class="primary" onclick="resolveUsage();closeInspector()" ${state.mapResolved?'disabled':''}>${state.mapResolved?'Resolved in draft':'Keep per-call usage unknown'}</button></div>`:'<h3>Validation</h3><p>Only allowlisted path access and transforms are permitted. No expressions, generated code, joins, or aggregation execute in a mapping.</p>'}`,'Field explanation')}
function resolveUsage(){if(state.mapSaved)return;state.mapResolved=true;mapFields[3].transform=mapFields[4].transform='unsupported';invalidateMapping();render();announce('Per-call usage left unknown. Validate the revised draft.')}
function profileInspector(){openInspector('Field profile',`<p>swe-chat-conversations.parquet · 2,000-row local excerpt. Types and presence below are illustrative profile results.</p><table style="margin-top:18px"><caption>Detected columns</caption><thead><tr><th scope="col" style="width:53%">Path</th><th scope="col">Type</th><th scope="col" class="right">Present</th></tr></thead><tbody>${[['conversation_id','string','2,000'],['turns[]','array','2,000'],['turns[].role','string','2,000'],['turns[].content','string','1,998'],['turns[].tool_calls[]','array','640'],['model','string','2,000'],['usage.prompt_tokens','integer','1,920'],['usage.completion_tokens','integer','1,920'],['created_at','epoch s','2,000'],['repo','string','1,984']].map(([p,t,c])=>`<tr><td class="mono">${p}</td><td>${t}</td><td class="right num">${c}</td></tr>`).join('')}</tbody></table><h3>Local size limit</h3><p>The upstream 1.3 GB file must be excerpted before upload. No URL import or streaming is promised for v0.1.</p>`,'Local profiler')}
function redactionInspector(sendText){window.pendingMessage=sendText;openInspector('Review outbound context',`<div class="notice">${icon('info')}No network calls are made by this prototype.</div><h3>What the configured provider receives</h3><ul><li>Field names, types and presence counts.</li><li>Allowlisted role and model labels.</li><li>Current mapping and your message.</li></ul><h3>Withheld from the sample</h3><p>Message content, tool arguments and output, conversation IDs, repository names, and user identifiers. Field names and your message may still contain sensitive information.</p><h3>Context preview</h3><pre>{\n  "rows_profiled": 2000,\n  "fields": {\n    "conversation_id": "string",\n    "turns": "array",\n    "created_at": "integer:epoch_seconds"\n  },\n  "sample_content": "[excluded]",\n  "sample_identifiers": "[excluded]"\n}</pre><h3>Destination</h3><p>Configured chat-completions provider. Production displays its actual endpoint and model here before sending.</p>${sendText?`<h3>Your message</h3><p>${esc(sendText)}</p><div class="actions"><button class="primary" onclick="applyMessage()">Send reviewed context · simulate</button></div>`:''}`,'Assistant boundary')}
function sendMessage(){const value=$('#chat-input').value.trim();if(value)redactionInspector(value);else{$('#chat-input').focus();toast('Write a revision request first.')}}
function applyMessage(){const text=window.pendingMessage;state.chat.push({role:'user',text});let reply;if(/milli/i.test(text)){mapFields[5].transform='epoch_ms';reply='Changed created_at to epoch_ms. Confirm the source unit before accepting this correction; validation and preview were invalidated.'}else if(/unknown|conversation|usage/i.test(text)){state.mapResolved=true;mapFields[3].transform=mapFields[4].transform='unsupported';reply='Removed per-call usage emissions. The original conversation totals remain in source records. Token coverage for emitted model calls is 0.'}else{reply='This offline prototype demonstrates unit correction and usage-scope revision. No mapping edit was applied for this request. You can edit the field table directly.'}state.chat.push({role:'assistant',text:reply});invalidateMapping();closeInspector();render();announce('Assistant proposal updated')}
function mappingPreview(){if(!state.mapValid)return;state.mapPreview=true;openInspector('Preview results',`<div class="notice good">${icon('check')}2,000 / 2,000 sampled records accepted</div><h3>Illustrative emissions</h3><dl class="data-list"><div><dt>Sessions</dt><dd>2,000 distinct conversation identities</dd></div><div><dt>Recorded model calls</dt><dd>6,480 assistant turns</dd></div><div><dt>Recorded tool calls</dt><dd>812 tool observations</dd></div><div><dt>Input and output tokens</dt><dd><strong>Unavailable</strong> · coverage 0 / 6,480 calls</dd></div></dl><h3>Warnings</h3><p>6,480 calls have unknown per-call usage. Conversation totals are retained in raw records and are not repeated per turn.</p><h3>Rejects</h3><p>No rejects in this illustrative preview. The preview is bound to the current draft.</p><div class="actions"><button class="primary" onclick="closeInspector();saveRevision()">Save as revision 1</button></div>`,'Local preview · no writes');render()}
function saveRevision(){if(!state.mapValid||!state.mapPreview)return;state.mapSaved=true;render();toast('swe-chat-v1 saved as immutable revision 1 in this demo.')}
const SWEHASH='6a1c2450b2a8e124a437cfb61de93277074975e210512702c1ed5a590ad94d88';
function confirmSwe(){if(!state.mapSaved)return;openInspector('Import reviewed excerpt',`<p><strong>swe-chat-conversations.parquet</strong><br>2,000 source records · source swe-chat</p><h3>Excerpt SHA-256 · illustrative</h3><div class="hash">${SWEHASH}</div><h3>Immutable mapping</h3><p>swe-chat-v1 · revision 1<br><code>map_swe_demo_revision_1</code></p><div class="notice warn" style="margin-top:18px">Per-call token usage is unavailable. The preview accepted 2,000 records with this explicit limitation.</div><div class="actions"><button class="primary" onclick="commitSwe(this)">Import 2,000 records · simulate</button></div>`,'Explicit write boundary')}
function commitSwe(b){b.disabled=true;b.textContent='Importing…';announce('Simulating excerpt import');setTimeout(()=>{closeInspector();state.report='swe';go('report');announce('Simulated import committed')},750)}
const originalReportPage=reportPage;reportPage=function(){if(state.report!=='swe')return originalReportPage();return heading('Import report','swe-chat excerpt · simulated result',`<button onclick="go('mapping')">Back to mapping</button>`)+`<div class="stack"><div class="notice good">${icon('check')}<div><strong>Committed · 2,000 records accepted</strong><p>Illustrative result only. No database or provider was contacted.</p></div></div><section class="panel"><div class="panelhead"><h2>Source-record outcomes</h2></div><div class="report-outcomes">${[['2,000','Accepted'],['0','Partial'],['0','Duplicate'],['0','Rejected'],['0','Ignored']].map(([v,l])=>`<div><strong>${v}</strong><span>${l}</span></div>`).join('')}</div></section><section class="panel panelbody"><div class="summary-counts"><div><b>2,000</b><span>Sessions</span></div><div><b>6,480</b><span>Model calls</span></div><div><b>812</b><span>Tool calls</span></div></div><p class="muted" style="margin-top:16px">Input and output tokens: <strong>Unavailable</strong> · coverage 0 / 6,480 calls</p><p class="small muted">Warnings: 6,480 calls with unknown per-call usage. No rejects.</p><div class="divider"></div><h2>swe-chat-conversations.parquet</h2><p class="small muted">Mapping: swe-chat-v1 · revision 1 · map_swe_demo_revision_1</p><div class="hash" style="margin-top:12px">${SWEHASH}</div><p class="small muted" style="margin-top:8px">Illustrative excerpt hash. This demo does not add the simulated attempt to the TraceLab dashboard.</p></section></div>`};
function definitionsPage(){return heading('Definitions','The contract behind every number.')+`<section class="panel"><table class="definitions"><caption>Metric registry <span class="muted" style="font-weight:400">· target v0.1</span></caption><thead><tr><th scope="col" style="width:17%">Metric / unit</th><th scope="col" style="width:34%">Definition</th><th scope="col" style="width:23%">Coverage / semantics</th><th scope="col" style="width:26%">Comparability</th></tr></thead><tbody>${[
['Sessions','sessions','Distinct source-scoped session identities in scope.','All reconciled identities.','Do not equate identities across source namespaces.'],['Model calls','observations','Count of recorded model-call observations.','All emitted model calls.','Native IDs may repeat; counts are not unique upstream requests.'],['Input tokens','tokens','Sum of known input_tokens on model calls.','Known / total calls; tracelab-claude or tracelab-codex.','Preserve source semantics. A reported sum is not equivalent work.'],['Output tokens','tokens','Sum of known output_tokens on model calls.','Known / total calls; source accounting tag.','Reasoning may be included differently by source.'],['Tool calls','observations','Count of emitted tool-call observations.','All tool observations, including unlinked calls.','A tool observation is not a unique external operation.'],['Cache read','tokens','Sum of known cache_read_tokens.','Known for tracelab-claude only.','Never infer cache usage for other semantics.'],['Activity by day','sessions / UTC day','Distinct sessions grouped by observed start date.','Known observed start / sessions; unknowns separate.','Observed span is not active time.'],['Token coverage','calls / calls','Known token values divided by recorded model calls.','Known zero is covered; null is not.','Coverage is a count, not an estimate of completeness upstream.'],['Rejects','source records','Rejected outcomes within the selected import attempt.','Record outcomes, not field-warning totals.','No summing repeated import attempts as unique source failures.'],['Missing usage','calls','Model calls lacking the selected usage measure.','Null and absent both lack a metric value.','Original missingness reason remains in diagnostics.'],['Unknown timestamps','sessions','Sessions without an observed start timestamp.','All sessions in scope.','Excluded from dated bins; retained in an unknown bucket.'],['Unlinked tools','observations','Tool calls lacking a model-call relationship.','All tool calls in scope.','Session link can still exist. Never silently drop these tools.'],['Observed interval','UTC timestamps','Earliest accepted child start through latest child end.','Accepted timestamps only.','Not active time; declared bounds remain separate.']].map(([a,u,d,s,c])=>`<tr><td>${a}<div class="table-sub">${u}</div></td><td>${d}</td><td>${s}</td><td>${c}</td></tr>`).join('')}</tbody></table></section><div class="notice" style="margin-top:16px">${icon('info')}When token coverage is 0, show “Unavailable”. Never manufacture a numeric zero.</div>`}
const commands=[['Dashboard','chart','dashboard','1'],['Import traces','upload','import','2'],['Imports history','history','history','3'],['Mapping workbench','mapping','mapping','4'],['Latest import report','file','report',''],['Example session','file','session',''],['Metric definitions','book','definitions','']];
function openPalette(){renderCommands('');$('#command-input').value='';$('#palette').showModal();$('#command-input').focus()}
function renderCommands(query){const list=commands.filter(c=>c[0].toLowerCase().includes(query.toLowerCase()));$('#commands').innerHTML=list.length?list.map(([label,ic,r,k])=>`<button onclick="$('#palette').close();state.demo='success';${r==='session'?'state.session=0;':''}${r==='report'?'state.report=\'committed\';':''}go('${r}')">${icon(ic)}${label}${k?`<kbd>${k}</kbd>`:''}</button>`).join(''):'<div class="empty"><p>No command matches. Try “import” or “session”.</p></div>'}
$('#palette').addEventListener('keydown',e=>{const buttons=$$('#commands button'),at=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();buttons[at===-1?(e.key==='ArrowDown'?0:buttons.length-1):(at+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}if(e.key==='Enter'&&document.activeElement===$('#command-input')){e.preventDefault();buttons[0]?.click()}});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if($('#palette').open)$('#palette').close();else if(!$('#inspector').open)openPalette();return}if(e.metaKey||e.ctrlKey||e.altKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||$('dialog[open]'))return;const r={'1':'dashboard','2':'import','3':'history','4':'mapping'}[e.key];if(r){e.preventDefault();go(r)}});
async function copyText(text){try{if(navigator.clipboard)await navigator.clipboard.writeText(text);else throw Error();announce('Copied to clipboard');toast('Copied exact text')}catch{const area=document.createElement('textarea');area.value=text;area.style.cssText='position:fixed;opacity:0';($('#inspector').open?$('#inspector-body'):document.body).append(area);area.select();const ok=document.execCommand('copy');area.remove();announce(ok?'Copied to clipboard':'Copy unavailable. Select the text manually.');toast(ok?'Copied exact text':'Select the text and copy with your keyboard.')}}
window.addEventListener('hashchange',()=>{if(location.hash==='#main'){$('#main').focus();return}closeInspector();state.demo='success';render();$('#main h1')?.focus();window.scrollTo(0,0)});
decorate();render();
