function sessionTable(rows){return `<div class="table-wrap"><table><caption class="sr">Sessions contributing to the current statement</caption><thead><tr><th>Session / repository</th><th>Agent</th><th>Observed start</th><th class="num">Model calls</th><th class="num">Input tokens</th><th class="num">Coverage</th><th><span class="sr">Open session</span></th></tr></thead><tbody>${rows.slice(state.pageIndex*6,(state.pageIndex+1)*6).map(s=>`<tr><td><a href="#session/${s.id}" class="data-link">${s.repo}</a><span class="sub mono">${s.external.slice(0,21)}…</span></td><td>${s.agent}</td><td>${s.date.slice(5)}<span class="sub">${s.id===0?'02:51:06.901':'08:00:00.000'}</span></td><td class="num">${n(s.calls)}</td><td class="num">${n(s.input)}</td><td class="num">${s.calls} / ${s.calls}</td><td><a href="#session/${s.id}" class="link" aria-label="Inspect session ${s.external}">↗</a></td></tr>`).join('')||'<tr><td colspan="7" class="muted">No matching sessions. Reset the scope to see observations.</td></tr>'}</tbody></table></div>`}

}</pre><p class="note">Separate scenario; this reject is not part of the clean TraceLab receipt. No real source hash is asserted for this illustrative payload.</p><button class="btn" data-action="copy-raw">Copy payload</button>`);break;
case 'redaction':redactionInfo(true);break;case 'redaction-info':redactionInfo(false);break;case 'propose':if(!$('#outbound-confirm').checked)break;await busy(el,'Requesting proposal…',()=>{state.proposal=true;state.draft.time='';state.messages=[{role:'Assistant',text:'I propose conversation-level model observations because usage is on the root record. created_at appears to be epoch seconds. Both interpretations need your review before validation.'}];closeDialog();render();toast('Proposal ready. Two interpretations require review.');});break;
case 'field-explain':{const [name,body]=explanations[el.dataset.id];openDialog('Note '+el.dataset.id+' · '+name,`<div class="eyebrow">Proposed mapping / explanation</div><p style="margin-top:18px">${body}</p><h3>Evidence</h3><p>From the local 2,000-row field profile. The assistant’s explanation is retained with the immutable mapping revision.</p>`);break}
case 'ambiguity':openDialog('Interpretation to approve',`<h3>One model observation per conversation</h3><p>usage.prompt_tokens and usage.completion_tokens are root totals. Copying them onto every assistant turn would multiply the token count. The proposed mapping emits one conversation-level observation per source record.</p><h3>Explicit semantics</h3><p>Tag these values swe-chat-conversation and keep them separate from TraceLab call-level accounting. If the source contract requires turn-level calls, leave tokens unknown until turn-level usage exists.</p><h3>Timestamp unit</h3><p>created_at values are epoch seconds. Choose the explicit conversion in the editable table.</p><button class="btn" data-action="close">Return to the draft</button>`);break;
case 'validate':validateDraft();break;case 'map-preview':if(!state.validated)break;await busy(el,'Previewing…',()=>{state.mapPreview=true;render();toast('Preview complete. This sample is ready to save.');});break;
case 'mapping-preview-details':openDialog('Mapping preview',`<p>200 of 2,000 excerpt records · no database writes.</p><dl class="definition-list"><dt>Accepted</dt><dd>200</dd><dt>Rejected / partial</dt><dd>0 / 0</dd><dt>Sessions</dt><dd>200 contributions</dd><dt>Model calls</dt><dd>200 conversation-level observations</dd><dt>Tool calls</dt><dd>64</dd></dl><h3>Sample emission · row:0</h3><pre>{
  "entity": "model_call",
  "fields": {
    "input_tokens": 12431,
    "output_tokens": 334,
    "token_semantics": "swe-chat-conversation"
  }
}</pre><p class="note">Illustrative mapping execution. Validate nested iteration and parent references against the actual DSL before implementation.</p>`);break;
case 'save-map':if(!state.mapPreview||!state.validated)break;state.revisions.push(Object.freeze({...state.draft,semanticsConfirmed:state.semanticsConfirmed}));state.saved=true;render();toast('swe-chat-v1 · revision '+state.revisions.length+' saved in this prototype. No data imported.');break;
case 'assistant-import':openDialog('Confirm the excerpt import',`<span class="pill warn">Illustrative import · no backend writes</span><p>Import the 2,000-row local excerpt using <strong>swe-chat-v1 · revision ${state.revisions.length}</strong> into <strong>swe-chat</strong>.</p><dl class="definition-list"><dt>File</dt><dd>swe-chat-conversations.parquet · excerpt</dd><dt>SHA-256</dt><dd class="hash">681a66702c4ac78c80de6dd921a7de75a7a37f162d913c729892c883184374fd<br><span class="muted">Illustrative excerpt identity, not the 1.3 GB upstream file.</span></dd><dt>Mapping revision</dt><dd class="mono">map_swe_chat_demo_${String(state.revisions.length).padStart(4,'0')} · revision ${state.revisions.length}</dd><dt>Preview</dt><dd>200 / 2,000 records. Full outcomes can differ.</dd></dl><p>Review the file identity and revision above before confirming.</p><button class="btn primary" data-action="assistant-commit">Confirm &amp; simulate import →</button>`);break;
case 'assistant-commit':await busy(el,'Recording excerpt…',()=>{openDialog('Excerpt import recorded',`<span class="pill ok">✓ Committed · simulated</span><p>swe-chat-conversations.parquet · swe-chat-v1, revision ${state.revisions.length}</p><dl class="definition-list"><dt>Source outcomes</dt><dd>2,000 accepted · 0 partial · 0 duplicate · 0 rejected · 0 ignored</dd><dt>Entities</dt><dd>2,000 session contributions · 2,000 conversation-level model observations · 640 tool observations</dd><dt>Warnings</dt><dd>60 null · 130 absent</dd></dl><p class="note">Illustrative full-run receipt. The TraceLab overview remains a separate source scope. No files or database rows were created by this prototype.</p><button class="btn" data-action="close">Return to saved mapping</button>`);toast('Simulated import complete.');});break;
case 'chart-data':{const rows=scopeRows();openDialog('Chart values & contributing sessions',`<p>Exact chart values in the current scope. Illustrative breakdowns sum to the supplied totals. Select a value to filter the statement and its sessions.</p><div class="table-wrap"><table><caption>Activity by recorded call start, UTC</caption><thead><tr><th>Date</th><th class="num">Model observations</th></tr></thead><tbody>${Array.from({length:6},(_,i)=>`<tr><td><button class="link" data-action="drill-dialog" data-kind="day" data-value="2026-06-0${i+1}">2026-06-0${i+1} ↗</button></td><td class="num">${n(sum(rows.filter(s=>s.date===`2026-06-0${i+1}`),'calls'))}</td></tr>`).join('')}</tbody></table></div><h3>Tool counts</h3><div id="tool-data-table"></div><p class="note">Model values are shown exactly on each bar. Tool observations are allocated across illustrative session records.</p>`);$('#tool-data-table').innerHTML=toolDataTable(rows);break}
case 'drill-dialog':state[el.dataset.kind]=el.dataset.value;state.pageIndex=0;closeDialog();render();$('#sessions').scrollIntoView();break;
}});
const TOOL_NAMES=['Bash','Read','Edit','Glob','Grep','Agent','WebFetch'];
sessions.forEach(s=>{const weights=[.32,.25,.19,.10,.07,.05,.02];let allocated=0;s.toolCounts=Object.fromEntries(TOOL_NAMES.map((t,i)=>{const count=s.id===0?(i<3?1:0):i===6?s.tools-allocated:Math.floor(s.tools*weights[i]);allocated+=count;return[t,count]}))});
function toolDataTable(rows){return `<table><caption>Recorded tool-call observations</caption><thead><tr><th>Tool</th><th class="num">Count</th></tr></thead><tbody>${TOOL_NAMES.map(t=>`<tr><td><button class="link" data-action="drill-dialog" data-kind="tool" data-value="${t}">${t} ↗</button></td><td class="num">${n(rows.reduce((a,s)=>a+s.toolCounts[t],0))}</td></tr>`).join('')}</tbody></table>`}
window.addEventListener('hashchange',()=>{closeDialog();route()});route();
</script>
</body>
