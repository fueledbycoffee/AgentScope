<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentScope · Passage (guided variant)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#F2F4F6; --surface:#FFFFFF; --surface-2:#F7F8FA; --surface-3:#EDF0F3;
  --line:#DCE1E6; --line-strong:#B4BDC7;
  --ink:#1C2733; --ink-2:#465360; --ink-3:#5F6C79;
  --accent:#0F6B5C; --accent-strong:#0B5346; --accent-soft:#E1F0EA; --accent-line:#9CCBBC;
  --warn:#7E5200; --warn-soft:#FFF3D6; --warn-line:#E8C46B;
  --danger:#B3261E; --danger-soft:#FBEAE8; --danger-line:#EBA39D;
  --info:#2C5AA6; --info-soft:#E7EEF9;
  --focus:#2456C8;
  --c1:#0F6B5C; --c2:#4E6FA6; --c3:#C48A2C; --c-muted:#CFD6DD;
  --sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --t12:.75rem; --t13:.8125rem; --t14:.875rem; --t16:1rem; --t20:1.25rem; --t26:1.625rem; --t34:2.125rem;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r1:4px; --r2:8px;
  --rail:248px; --stage:760px; --chat:300px;
  --shadow:0 1px 2px rgba(28,39,51,.06),0 10px 28px -14px rgba(28,39,51,.22);
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-family:var(--sans);font-size:16px;color:var(--ink);background:var(--ground);-webkit-text-size-adjust:100%}
body{margin:0;font-size:var(--t14);line-height:1.5;font-synthesis:none;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25;letter-spacing:-.005em}
h1{font-size:var(--t26)}
h2{font-size:var(--t16)}
h3{font-size:var(--t14)}
p{margin:0}
a{color:var(--accent);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.18em}
a:hover{color:var(--accent-strong)}
code,.mono{font-family:var(--mono);font-size:.92em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:2px}
[hidden]{display:none!important}
.skip{position:absolute;left:var(--s4);top:-60px;background:var(--surface);padding:var(--s2) var(--s3);border:1px solid var(--line);z-index:20}
.skip:focus{top:var(--s2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink-3)}
.small{font-size:var(--t13)}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{display:flex;align-items:center;gap:var(--s6);height:52px;padding:0 var(--s6);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-weight:600;color:var(--ink);text-decoration:none;font-size:var(--t16);letter-spacing:-.01em}
.top nav{display:flex;gap:var(--s5);height:100%}
.top nav a{display:flex;align-items:center;height:52px;color:var(--ink-2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.top nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--accent)}
.top nav a:hover{color:var(--ink)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:var(--s3);font-size:var(--t13);color:var(--ink-3)}
.top-right select{height:28px;padding:0 var(--s2);border:1px solid var(--line-strong);border-radius:var(--r1);background:var(--surface);font-size:var(--t13)}

/* ---------- page shells ---------- */
main{padding:var(--s6) var(--s6) var(--s8);max-width:1440px;margin:0 auto}
.crumbs{font-size:var(--t13);color:var(--ink-3);margin-bottom:var(--s3);display:flex;gap:var(--s2);flex-wrap:wrap}
.crumbs a{color:var(--ink-3)}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s5);margin-bottom:var(--s5);flex-wrap:wrap}
.page-head .lede{color:var(--ink-2);margin-top:var(--s1);max-width:64ch}
.wizard{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);gap:var(--s7);align-items:start}
.stage{max-width:var(--stage)}
.stage.wide{max-width:none}
.stage-head{margin-bottom:var(--s5)}
.stage-head .lede{color:var(--ink-2);margin-top:var(--s1);max-width:66ch}
.bar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:var(--s6);padding-top:var(--s4);border-top:1px solid var(--line)}
.bar .right{display:flex;gap:var(--s2);align-items:center;margin-left:auto}
main section{margin-top:var(--s6)}
.stage-head+section,.page-head+section{margin-top:0}
.section-title{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3)}
.section-title .muted{font-size:var(--t13)}

/* ---------- rail (the route) ---------- */
.rail{position:sticky;top:var(--s5)}
.rail ol{list-style:none;margin:0;padding:0}
.stop{position:relative;padding:0 0 var(--s5) 36px}
.stop::before{content:"";position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line)}
.stop:last-child::before{display:none}
.stop.done::before{background:var(--accent-line)}
.stop .dot{position:absolute;left:0;top:1px;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;font-size:var(--t12);font-weight:500;color:var(--ink-3)}
.stop.current .dot{border-color:var(--accent);background:var(--accent);color:#fff}
.stop.done .dot{border-color:var(--accent);color:var(--accent);background:var(--surface)}
.stop .name{display:block;font-weight:500;color:var(--ink-3);line-height:26px}
.stop.current .name,.stop.done .name{color:var(--ink)}
.stop button.name{background:none;border:0;padding:0;cursor:pointer;text-align:left;font-weight:500}
.stop .fact{display:block;font-family:var(--mono);font-size:var(--t12);color:var(--ink-3);margin-top:2px;overflow-wrap:anywhere;line-height:1.45}
.stop .fact b{font-weight:500;color:var(--ink-2)}
.rail-foot{margin-top:var(--s2);padding-top:var(--s4);border-top:1px solid var(--line);font-size:var(--t13);color:var(--ink-3)}

/* ---------- buttons & controls ---------- */
.btn{display:inline-flex;align-items:center;gap:var(--s2);height:36px;padding:0 var(--s4);border:1px solid var(--line-strong);border-radius:var(--r1);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent)}
.btn.quiet:hover{background:var(--accent-soft)}
.btn.sm{height:28px;padding:0 var(--s3);font-size:var(--t13)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--danger)}
.field{display:flex;flex-direction:column;gap:var(--s1)}
.field>span{font-size:var(--t13);color:var(--ink-2);font-weight:500}
input[type=text],input[type=search],select,textarea{height:36px;padding:0 var(--s3);border:1px solid var(--line-strong);border-radius:var(--r1);background:var(--surface);min-width:0;max-width:100%}
textarea{height:auto;padding:var(--s2) var(--s3);resize:vertical}
input.mono{font-family:var(--mono);font-size:var(--t13)}
input[aria-invalid=true]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger) inset}
.filters{display:flex;gap:var(--s3);flex-wrap:wrap;align-items:flex-end}
.filters .field{min-width:150px}
.inline-check{display:inline-flex;align-items:center;gap:var(--s2)}

/* ---------- notes, badges ---------- */
.note{padding:var(--s3) var(--s4);border:1px solid var(--line);border-left:3px solid var(--line-strong);border-radius:var(--r1);background:var(--surface);display:flex;gap:var(--s3);align-items:flex-start}
.note.ok{border-left-color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}
.note.warn{border-left-color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.note.danger{border-left-color:var(--danger);background:var(--danger-soft);border-color:var(--danger-line)}
.note.info{border-left-color:var(--info);background:var(--info-soft)}
.note .body{flex:1;min-width:0}
.note .body p+p{margin-top:var(--s1)}
.badge{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 var(--s2);border-radius:999px;font-size:var(--t12);font-weight:500;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.badge.committed{background:var(--accent-soft);color:var(--accent-strong)}.badge.committed::before{background:var(--accent)}
.badge.duplicate{background:var(--info-soft);color:var(--info)}.badge.duplicate::before{background:var(--info)}
.badge.failed{background:var(--danger-soft);color:var(--danger)}.badge.failed::before{background:var(--danger)}
.badge.running{background:var(--warn-soft);color:var(--warn)}.badge.running::before{background:var(--warn)}
.badge.ok{background:var(--accent-soft);color:var(--accent-strong)}.badge.ok::before{background:var(--accent)}
.badge.amb{background:var(--warn-soft);color:var(--warn)}.badge.amb::before{background:var(--warn)}
.badge.err{background:var(--danger-soft);color:var(--danger)}.badge.err::before{background:var(--danger)}
.chip{display:inline-flex;align-items:center;gap:var(--s2);height:26px;padding:0 var(--s1) 0 var(--s3);border:1px solid var(--accent-line);background:var(--accent-soft);color:var(--accent-strong);border-radius:999px;font-size:var(--t13)}
.chip button{border:0;background:none;width:20px;height:20px;border-radius:50%;cursor:pointer;color:inherit;display:grid;place-items:center}
.chip button:hover{background:rgba(15,107,92,.15)}

/* ---------- facts (dl) ---------- */
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:var(--s2) var(--s5);margin:0}
.facts dt{color:var(--ink-3);font-size:var(--t13);padding-top:2px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts dd.mono{font-size:var(--t13)}
.facts.tight{gap:var(--s1) var(--s4)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4) var(--s5)}
.panel+.panel{margin-top:var(--s3)}
.receipt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s5)}
.receipt .facts{gap:var(--s3) var(--s5)}
.stats{display:flex;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.stats>div{flex:1;padding:var(--s3) var(--s4);border-left:1px solid var(--line);min-width:0}
.stats>div:first-child{border-left:0}
.stats .k{font-size:var(--t13);color:var(--ink-2)}
.stats .v{font-size:var(--t20);font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stats .v.na{color:var(--ink-3);font-weight:500;font-size:var(--t16)}
.stats .c{font-size:var(--t12);color:var(--ink-3);margin-top:2px}

/* ---------- dropzone ---------- */
.drop{border:1.5px dashed var(--line-strong);border-radius:var(--r2);padding:var(--s7) var(--s5);text-align:center;background:var(--surface)}
.drop h2{font-size:var(--t16);font-weight:500}
.drop p{color:var(--ink-3);margin-top:var(--s1)}
.drop .acts{display:flex;gap:var(--s2);justify-content:center;margin-top:var(--s4)}
.progress{height:6px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .25s}

/* ---------- tables ---------- */
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
table{border-collapse:collapse;width:100%;font-size:var(--t13)}
caption{text-align:left;font-weight:500;font-size:var(--t14);padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);color:var(--ink)}
caption .muted{font-weight:400;font-size:var(--t13)}
th{font-weight:500;color:var(--ink-2);text-align:left;background:var(--surface-2);padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:var(--t12);overflow-wrap:anywhere}
td.nw{white-space:nowrap}
.tbl td.mono a{white-space:nowrap}
td .mono{font-size:var(--t12)}
tbody tr.link{cursor:pointer}
tbody tr.link:hover td{background:var(--surface-2)}
.tbl.compact td,.tbl.compact th{padding:6px var(--s3)}
.tbl-empty{padding:var(--s5) var(--s4);color:var(--ink-3);text-align:center}
.na{color:var(--ink-3)}
.row-msg td{padding-top:0;border-top:0}
.row-msg .msg{font-size:var(--t12);padding:0 0 var(--s2) 0;display:flex;gap:var(--s2);align-items:flex-start}
.row-msg .msg.err{color:var(--danger)}.row-msg .msg.amb{color:var(--warn)}
.row-msg .msg .tag{font-family:var(--mono);font-size:11px;padding:1px 5px;border-radius:3px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pager{display:flex;gap:var(--s3);align-items:center;justify-content:flex-end;font-size:var(--t13);color:var(--ink-3);margin-top:var(--s2)}

/* ---------- popover & drawer ---------- */
.pop{position:absolute;z-index:30;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);padding:var(--s4)}
.pop h3{margin-bottom:var(--s2)}
.pop p+p{margin-top:var(--s2)}
.pop .foot{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line);font-size:var(--t13)}
.help{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink-3);font-size:11px;font-weight:500;cursor:pointer;vertical-align:middle;line-height:1}
.help:hover{border-color:var(--ink-3);color:var(--ink)}
.help[aria-expanded=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
dialog.drawer{position:fixed;inset:0 0 0 auto;margin:0;width:min(720px,92vw);height:100dvh;max-height:100dvh;border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0;display:flex;flex-direction:column}
dialog.drawer:not([open]){display:none}
dialog.drawer::backdrop{background:rgba(28,39,51,.4)}
.drawer-head{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.drawer-head h2{flex:1;min-width:0}
.drawer-body{padding:var(--s5);overflow:auto;flex:1}
.drawer-body pre{margin:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r1);padding:var(--s3) var(--s4);font-family:var(--mono);font-size:var(--t12);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.drawer-body .facts{margin-bottom:var(--s4)}
.x{width:32px;height:32px;border:1px solid transparent;border-radius:var(--r1);background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink-2)}
.x:hover{background:var(--surface-2);border-color:var(--line)}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.kpi{padding:var(--s4) var(--s5);border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .k{display:flex;align-items:center;gap:var(--s2);font-size:var(--t13);color:var(--ink-2)}
.kpi .v{font-size:var(--t34);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:var(--s1);line-height:1.15;overflow-wrap:anywhere}
.kpi .v.na{font-size:var(--t20);font-weight:500;color:var(--ink-3);padding:6px 0}
.kpi .c{font-size:var(--t12);color:var(--ink-3);margin-top:var(--s1)}
.kpi .c b{font-weight:500;color:var(--ink-2)}
.charts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}
figure.chart{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:var(--s4) var(--s4) var(--s3)}
figure.chart figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);font-weight:500;margin-bottom:var(--s2)}
figure.chart figcaption .muted{font-size:var(--t12);font-weight:400}
figure.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.chart .lbl{fill:var(--ink-2)}
.chart .bar{cursor:pointer}
.chart .bar:hover rect,.chart .bar:focus-visible rect{opacity:.75}
.chart .bar:focus-visible{outline:2px solid var(--focus)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{stroke:var(--line-strong)}
.chart-foot{font-size:var(--t12);color:var(--ink-3);margin-top:var(--s2)}
.quality{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.quality a{display:inline-flex;align-items:center;gap:var(--s2);height:30px;padding:0 var(--s3);border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink-2);text-decoration:none;font-size:var(--t13)}
.quality a b{font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.quality a.flag{border-color:var(--warn-line);background:var(--warn-soft);color:var(--warn)}
.quality a.flag b{color:var(--warn)}
.quality a:hover{border-color:var(--line-strong)}
.quality .lead{font-size:var(--t13);color:var(--ink-3);margin-right:var(--s1)}

/* ---------- outcomes bar (report) ---------- */
.outcomes{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-3);margin:var(--s3) 0 var(--s2)}
.outcomes span{display:block;height:100%}
.outcomes span[style*="width:0%"]{display:none}
.outcomes span{min-width:4px}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:var(--t13);color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

/* ---------- assistant ---------- */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,var(--chat));gap:var(--s5);align-items:start}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);display:flex;flex-direction:column;position:sticky;top:var(--s5);max-height:calc(100dvh - 120px)}
.chat-head{padding:var(--s3) var(--s4);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:var(--s2)}
.chat-head .muted{font-size:var(--t12);margin-left:auto}
.chat-log{padding:var(--s4);overflow:auto;flex:1;display:flex;flex-direction:column;gap:var(--s4);min-height:200px}
.msg-a,.msg-u{font-size:var(--t13);line-height:1.5}
.msg-a .who,.msg-u .who{font-size:var(--t12);color:var(--ink-3);margin-bottom:2px}
.msg-u{background:var(--surface-2);border-radius:var(--r2);padding:var(--s2) var(--s3)}
.msg-a p+p{margin-top:var(--s2)}
.msg-a ul{margin:var(--s1) 0 0;padding-left:18px}
.msg-a .ref{font-family:var(--mono);font-size:11px;background:var(--surface-3);padding:1px 5px;border-radius:3px}
.msg-a .change{margin-top:var(--s2);border-left:2px solid var(--accent-line);padding-left:var(--s2);color:var(--ink-2);font-size:var(--t12)}
.chat-sugg{padding:0 var(--s4) var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2)}
.chat-sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:var(--t12);cursor:pointer;color:var(--ink-2)}
.chat-sugg button:hover{border-color:var(--line-strong);color:var(--ink)}
.chat-in{border-top:1px solid var(--line);padding:var(--s3) var(--s4);display:flex;gap:var(--s2);align-items:flex-end}
.chat-in textarea{flex:1;min-height:36px;max-height:120px}
.chat-foot{padding:var(--s2) var(--s4) var(--s3);font-size:var(--t12);color:var(--ink-3)}
.mtable input.mono{height:30px;width:100%;min-width:0;padding:0 var(--s2);border-color:transparent;background:transparent}
.mtable input.mono:hover{border-color:var(--line)}
.mtable input.mono:focus{border-color:var(--line-strong);background:var(--surface)}
.mtable select{height:30px;padding:0 var(--s2);font-size:var(--t13);border-color:transparent;background:transparent}
.mtable select:hover,.mtable select:focus{border-color:var(--line-strong);background:var(--surface)}
.mtable td.tgt{font-weight:500;white-space:nowrap}
.mtable td:nth-child(3){font-size:var(--t12)}
.mtable .badge{padding:0 6px}
.mtable td.tgt .ent{color:var(--ink-3);font-weight:400}
.mtable tr.rule td{background:var(--surface-2);font-weight:500;color:var(--ink-2)}
.mtable tr.rule td .mono{font-weight:400;color:var(--ink)}
.validate-line{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s3);font-size:var(--t13);color:var(--ink-2)}
.redact{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.redact .panel h3{margin-bottom:var(--s2)}
.redact ul{margin:0;padding-left:18px}
.redact li+li{margin-top:var(--s1)}

/* ---------- states ---------- */
.skel{background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:var(--r1);height:14px}
.skel.lg{height:28px}.skel.row{height:38px;border-radius:0;border-bottom:1px solid var(--line)}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.empty{padding:var(--s7) var(--s5);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2)}
.empty h2{font-weight:500;font-size:var(--t16)}
.empty p{color:var(--ink-3);margin:var(--s1) auto var(--s4);max-width:48ch}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-strong);border-top-color:var(--accent);animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.skel,.spin{animation:none}.progress>span{transition:none}}

/* ---------- responsive ---------- */
@media (max-width:1100px){
  .charts{grid-template-columns:1fr 1fr}
  .split{grid-template-columns:1fr}
  .chat{position:static;max-height:none}
}
@media (max-width:960px){
  main{padding:var(--s5) var(--s4) var(--s7)}
  .top{padding:0 var(--s4);gap:var(--s4)}
  .wizard{grid-template-columns:1fr;gap:var(--s5)}
  .rail{position:static}
  .rail ol{display:flex;gap:var(--s4);overflow-x:auto;padding-bottom:var(--s2)}
  .stop{padding:0 0 0 30px;flex:0 0 auto;min-width:130px}
  .stop::before{display:none}
  .stop .fact{display:none}
  .rail-foot{display:none}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .redact{grid-template-columns:1fr}
  .stats{flex-wrap:wrap}.stats>div{flex:1 1 40%}
}

function deepLink(head,q){const st=Number(q.get('step'));if(!st)return;

function route(){

}

function impActions(act,el){
  const I=S.imp;
  if(act==='imp-upload'){I.uploading=true;I.progress=0;rerender();const t=setInterval(()=>{I.progress=Math.min(100,I.progress+17);if(I.progress>=100){clearInterval(t);I.uploading=false;I.upload={...FILE}}rerender()},180)}
  else if(act==='imp-reset'){I.upload=null;I.mapping=null;I.preview=null;rerender()}
  else if(act==='imp-next'){if(I.step===1&&!I.mapping)I.mapping=MAP;I.step=Math.min(4,I.step+1);rerender()}
  else if(act==='imp-back'){I.step=Math.max(1,I.step-1);rerender()}
  else if(act==='imp-goto'){I.step=Number(el.dataset.step);rerender()}
  else if(act==='imp-pick'){I.mapping=el.value===MAP.id?MAP:MAP_OLD;rerender()}
  else if(act==='imp-preview'){if(!I.mapping)I.mapping=MAP;I.previewing=true;rerender();setTimeout(()=>{I.previewing=false;I.preview=PREVIEW;I.step=3;rerender()},900)}
  else if(act==='imp-run'){I.running=true;I.runProgress=0;rerender();const t=setInterval(()=>{I.runProgress=Math.min(100,I.runProgress+9);rerender();if(I.runProgress>=100){clearInterval(t);I.running=false;const id=S.demo==='duplicate'?IMPORTS[1].id:IMPORTS[0].id;S.justImported=id;Object.assign(I,{step:1,upload:null,mapping:null,preview:null});go('#/imports/'+id)}},140)}

function barChart({id,data,label,value,color,onKey,fmtAxis,total}){
  const W=380,H=190,pl=40,pr=8,pt=10,pb=28;const max=Math.max(...data.map(value));const iw=W-pl-pr,ih=H-pt-pb;const n=data.length;const bw=Math.min(28,iw/n*0.68);const gap=iw/n;
  const ticks=[0,.5,1].map(t=>Math.round(max*t));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><title>${esc(label)}</title>
   ${ticks.map(t=>{const y=pt+ih-(t/max)*ih;return `<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${fmtAxis(t)}</text>`}).join('')}
   <line class="axis" x1="${pl}" x2="${W-pr}" y1="${pt+ih}" y2="${pt+ih}"/>
   ${data.map((d,i)=>{const v=value(d);const h=v/max*ih;const x=pl+gap*i+(gap-bw)/2;const y=pt+ih-h;const key=onKey(d);const lab=d[0];
     return `<g class="bar" tabindex="0" role="button" data-act="chart" data-kind="${id}" data-key="${esc(key)}" aria-label="${esc(lab)}: ${fmt(v)}${total?' of '+fmt(total):''}. Show matching sessions"><title>${esc(lab)} · ${fmt(v)}</title><rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="2" fill="${color(d,i)}"/>${n<=8||i%2===0?`<text class="lbl" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(id==='day'?lab.slice(5):lab.replace(/^claude-/,''))}</text>`:''}</g>`}).join('')}</svg>`;
}

 {t:'model_call.input_tokens',ent:'model_call',src:'$.usage.prompt_tokens',tr:'int · conversation total',st:'amb',why:'usage is per conversation, not per turn. Proposed: assign to the last assistant turn, null on the others, so sums stay exact.'},
 {t:'model_call.output_tokens',ent:'model_call',src:'$.usage.completion_tokens',tr:'int · conversation total',st:'ok',why:'Same placement as input_tokens.'},

 {t:'tool_call.started_at',ent:'tool_call',src:'—',tr:'absent · nullable',st:'ok',why:'Not in the source. Counted in the quality strip as unknown timestamps.'},
]}
function validatePath(p,row){
  if(row.tr==='literal')return null;if(p==='—'||p==='')return null;
  if(!p.startsWith('$.'))return 'A source path starts with $. (or is a quoted literal).';
  const bare=p.slice(2).replace(/\[\*\]/g,'[*]');
  const ok=COLS.some(c=>c===bare||c.endsWith('.'+bare)||('turns[*].tool_calls[*].'+bare)===c);
  if(!ok){const near=COLS.map(c=>[c,lev(bare,c)]).sort((a,b)=>a[1]-b[1])[0];return `Unknown column ${bare} — nearest in the profile: ${near[0]}`}
  return null;
}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i]}for(let j=0;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
function assistantPage(){
  const A=S.asst;if(!A.rows)A.rows=proposalRows();
  const errs=A.rows.filter(r=>r.st==='err').length,ambs=A.rows.filter(r=>r.st==='amb').length;
  const facts=['2,000 rows · 7 columns',A.got?'profile + 12 values / col':'',A.got?`${A.rows.filter(r=>r.t).length} fields · ${errs} errors · ${ambs} open`:'',A.step>4?'200 rows · 0 rejected':'',''];
  let stage;
  if(A.step===1)stage=asstProfile();else if(A.step===2)stage=asstSend();else if(A.step===3)stage=asstMapping(errs,ambs);else if(A.step===4)stage=asstPreview();else stage=asstSave();
  return `<div class="wizard">${rail(ASST_STOPS,A.step,facts,'asst-goto')}<div class="stage ${A.step===3?'wide':''}">${stage}</div></div>`;
}
function asstProfile(){
  return `<header class="stage-head"><h1>Profile of an unknown file</h1><p class="lede">swe-chat-conversations.parquet · excerpt of 2,000 rows from a 1.3 GB upstream file. Read locally; nothing has left this machine.</p></header>
   <div class="tbl compact"><table><caption>Columns <span class="muted">· 7 top-level, nested fields under turns</span></caption><thead><tr><th>Column</th><th>Type</th><th>Non-null</th><th>Distinct</th><th>Example</th></tr></thead><tbody>
   ${PROFILE.map(r=>`<tr><td class="mono">${r[0]}</td><td class="mono muted">${r[1]}</td><td class="tabular">${r[2]}</td><td class="tabular">${r[3]}</td><td class="mono">${esc(r[4])}</td></tr>`).join('')}</tbody></table></div>

   ${S.demo==='error'?`<div class="note danger" role="alert" style="margin-bottom:16px"><div class="body"><p><b>Provider unreachable.</b> openrouter answered 502 after 30 s. Nothing was sent twice; the profile is unchanged.</p><p>Check <code>AGENTSCOPE_LLM_BASE_URL</code> in <code>backend/.env</code>, or continue without the assistant and write the mapping by hand.</p></div></div>`:''}
   <div class="redact"><div class="panel"><h3>Sent</h3><ul class="small"><li>Column names, types, null and distinct counts</li><li>12 sampled values per column, strings cut at 80 characters</li><li><code>turns[*].content</code> replaced by its length in characters</li><li><code>repo</code> values hashed (<code>sha256:9a1c…</code>) — 311 distinct kept distinct</li></ul></div>
   <div class="panel"><h3>Kept here</h3><ul class="small"><li>The file itself and every full row</li><li>Turn contents, tool arguments, tool outputs</li><li>Anything you type in the conversation is sent; do not paste rows</li><li>The API key (backend only)</li></ul></div></div>
   <dl class="facts" style="margin-top:16px"><dt>Provider</dt><dd>openrouter · anthropic/claude-opus-4-7 <span class="muted small">from backend/.env, not stored in the mapping</span></dd><dt>Size</dt><dd>1,412 tokens of context</dd></dl>
   <div class="bar"><button type="button" class="btn" data-act="asst-back">Back</button><div class="right"><button type="button" class="btn" data-act="asst-manual">Write the mapping by hand</button><button type="button" class="btn primary" data-act="asst-send" data-autofocus>Send the profile and get a proposal</button></div></div>`;

function asstMapping(errs,ambs){
  const A=S.asst;
  const table=`<div class="tbl mtable"><table><caption>Proposed mapping <span class="muted">· edit any source path; validation runs as you type</span></caption><thead><tr><th style="width:25%">Target</th><th style="width:37%">Source path</th><th>Transform</th><th style="width:76px">Status</th></tr></thead><tbody>
   ${A.rows.map((r,i)=>r.rule?`<tr class="rule"><td colspan="4">rule <span class="mono">${r.rule}</span> · <span class="mono">${esc(r.sel)}</span> · identity <span class="mono">${esc(r.key)}</span></td></tr>`
     :`<tr><td class="tgt"><span class="ent">${r.ent}.</span>${r.t.split('.')[1]}</td><td><input class="mono" type="text" value="${esc(r.src)}" data-act="asst-edit" data-i="${i}" aria-label="Source path for ${r.t}" aria-invalid="${r.st==='err'}" aria-describedby="m${i}"></td><td class="small muted">${esc(r.tr)}</td><td><span class="badge ${r.st}">${({ok:'OK',amb:'Open',err:'Error'})[r.st]}</span></td></tr>
      <tr class="row-msg"><td colspan="4"><div class="msg ${r.st}" id="m${i}">${r.st==='err'?esc(r.err):esc(r.why)}${r.st==='amb'?` <button type="button" class="btn quiet sm" data-act="asst-accept" data-i="${i}">Accept as proposed</button>`:''}</div></td></tr>`).join('')}
   </tbody></table></div>
   <div class="validate-line"><button type="button" class="btn sm" data-act="asst-validate">Validate mapping</button>${A.validated?`<span role="status">${errs?`<span class="badge err">${errs} error${errs>1?'s':''}</span> fix before the dry run`:`<span class="badge ok">Schema and semantics pass</span> ${ambs?ambs+' open question'+(ambs>1?'s':'')+' — allowed, recorded in the revision':'no open questions'}`}</span>`:`<span class="muted">${A.rows.filter(r=>r.t).length} fields · ${errs} error${errs===1?'':'s'} · ${ambs} open</span>`}</div>`;
  const log=A.msgs.map(m=>m.who==='you'?`<div class="msg-u"><div class="who">You</div>${esc(m.text)}</div>`:`<div class="msg-a"><div class="who">Assistant</div>${m.html}</div>`).join('');
  const chat=`<aside class="chat" aria-label="Conversation with the assistant"><div class="chat-head"><h2>Conversation</h2><span class="muted">claude-opus-4-7</span></div>
   <div class="chat-log" aria-live="polite">${log}</div>
   <div class="chat-sugg">${[['Why the last assistant turn?','q-last'],['Set the agent to swe-agent','q-agent'],['Can turns get their own time?','q-time']].map(([t,k])=>`<button type="button" data-act="asst-ask" data-q="${k}">${t}</button>`).join('')}</div>
   <form class="chat-in" data-act="asst-form"><label class="sr" for="chat-text">Message to the assistant</label><textarea id="chat-text" rows="1" placeholder="Ask or request a change"></textarea><button type="submit" class="btn primary sm">Send</button></form>
   <div class="chat-foot">Replies change the table above, never the database. Every change is listed and can be undone by editing the cell.</div></aside>`;
  return `<header class="stage-head"><h1>Review the proposed mapping</h1><p class="lede">The assistant explains each field and marks what it could not decide. Edit the table or ask; the table is the only thing that will be saved.</p></header>
   <div class="split"><div>${table}</div>${chat}</div>
   <div class="bar"><button type="button" class="btn" data-act="asst-back">Back</button><div class="right"><span class="small muted">${errs?'Fix the errors to continue':''}</span><button type="button" class="btn primary" data-act="asst-preview" ${errs||A.previewing?'disabled':''}>${A.previewing?'<span class="spin" aria-hidden="true"></span> Running':'Run a dry run on 200 rows'}</button></div></div>`;
}
const SWE_PREVIEW={records:{sampled:200,accepted:194,partial:6,rejected:0},entities:{session:200,model_call:742,tool_call:1318},warnings:{null:87,absent:1318},rejects:[],
 emissions:[{entity:'session',path:'session',loc:'row:0',fields:'identity_key: "conv_5f1c9a2e", agent: "swe-agent", repo: "octo/infra"'},{entity:'model_call',path:'model_call[3]',loc:'row:0',fields:'model: "gpt-5.5-codex", started_at: 2024-06-04T02:51:06Z, input_tokens: 18443, token_semantics: "swe-chat-conversation-total"'},{entity:'model_call',path:'model_call[1]',loc:'row:0',fields:'model: "gpt-5.5-codex", started_at: 2024-06-04T02:51:06Z, input_tokens: null'},{entity:'tool_call',path:'model_call[1].tool_calls[0]',loc:'row:0',fields:'tool_name: "bash", started_at: null'},{entity:'session',path:'session',loc:'row:1',fields:'identity_key: "conv_a03b7d51", agent: "swe-agent", repo: null (warning: null)'}]};
function asstPreview(){
  return `<header class="stage-head"><h1>Dry run on 200 rows</h1><p class="lede">The edited mapping applied to the first 200 rows of the excerpt. Nothing was written and the mapping is not saved yet.</p></header>

function asstSave(){
  const A=S.asst;
  if(A.saving)return `<header class="stage-head"><h1>Saving and importing</h1></header><div class="panel" role="status" aria-live="polite"><p><span class="spin" aria-hidden="true"></span>&nbsp; Saved swe-chat-v1 revision 1. Applying it to 2,000 rows in one transaction.</p><div class="progress" style="margin-top:12px"><span style="width:${A.saveProgress||0}%"></span></div></div>`;

   <div class="bar"><button type="button" class="btn" data-act="asst-back">Back</button><div class="right"><button type="button" class="btn" data-act="asst-save-only">Save without importing</button><button type="button" class="btn primary" data-act="asst-save" data-autofocus>Save and import 2,000 rows</button></div></div>`;

const REPLIES={
 intro:`<p>I read the profile of <span class="ref">swe-chat-conversations.parquet</span>: 2,000 rows, 7 columns, turns nested as a list. The mapping on the left emits sessions from <span class="ref">conversation_id</span>, model calls from assistant turns and tool calls from <span class="ref">tool_calls[*]</span>.</p><p>Three things I could not decide:</p><ul><li>the agent name is nowhere in the data;</li><li>usage is per conversation, so per-call tokens are not recoverable;</li><li>only <span class="ref">created_at</span> carries time.</li></ul><p>Each is marked <b>Open</b> in the table with what I proposed.</p>`,
 'q-last':`<p>Putting the conversation total on the last assistant turn keeps the session sum exact (<span class="ref">18,443</span> stays 18,443) and keeps coverage honest: 1 of <i>n</i> calls known. Spreading it evenly would invent per-call numbers. The semantics tag <span class="ref">swe-chat-conversation-total</span> stops the dashboard from summing it with TraceLab's per-call tokens.</p>`,
 'q-agent':`<p>Done. <span class="ref">session.agent</span> is now the literal <span class="ref">"swe-agent"</span>. It is a constant you chose, not something in the data; the revision note will say so.</p><div class="change">Changed session.agent: "unknown" → "swe-agent"</div>`,
 'q-time':`<p>Not from this file: turns have no timestamp and I will not derive one from order. If the upstream 1.3 GB file has a <span class="ref">turns[*].created_at</span>, re-profile it and I will map it; otherwise every call keeps the conversation start and the span shows as 0 ms with that explanation.</p>`,
 other:`<p>I can only change the table, not the file or the database. Tell me which target field to change, or edit the cell directly and I will re-validate it.</p>`};
function asstActions(act,el,ev){
  const A=S.asst;
  const push=(k,extra)=>{A.msgs.push({who:'assistant',html:REPLIES[k]});if(extra)extra()};
  if(act==='asst-next'){A.step=Math.min(5,A.step+1);rerender()}
  else if(act==='asst-back'){A.step=Math.max(1,A.step-1);rerender()}
  else if(act==='asst-goto'){A.step=Number(el.dataset.step);rerender()}
  else if(act==='asst-send'){A.sending=true;rerender();setTimeout(()=>{A.sending=false;A.got=true;A.rows=proposalRows();A.msgs=[];push('intro');A.step=3;rerender()},1100)}
  else if(act==='asst-manual'){A.got=true;A.rows=proposalRows().map(r=>r.t?{...r,src:r.tr==='literal'?'"unknown"':'',st:'err',err:'Source path required'}:r);A.msgs=[{who:'assistant',html:'<p class="muted">The assistant was not used. Fill in each source path; validation runs as you type.</p>'}];A.step=3;rerender()}
  else if(act==='asst-edit'){const r=A.rows[Number(el.dataset.i)];r.src=el.value;const e=validatePath(el.value.trim(),r);if(e){r.st='err';r.err=e}else{r.st=r.st==='err'?'ok':r.st}A.validated=false;
    const tr=el.closest('tr');const msg=tr.nextElementSibling.querySelector('.msg');msg.className='msg '+r.st;msg.textContent=r.st==='err'?r.err:r.why;el.setAttribute('aria-invalid',r.st==='err');tr.querySelector('.badge').className='badge '+r.st;tr.querySelector('.badge').textContent=({ok:'OK',amb:'Open',err:'Error'})[r.st];
    const errs=A.rows.filter(x=>x.st==='err').length;const btn=$('[data-act=asst-preview]');if(btn)btn.disabled=errs>0;const vl=$('.validate-line span');if(vl)vl.innerHTML=`<span class="muted">${A.rows.filter(x=>x.t).length} fields · ${errs} error${errs===1?'':'s'} · ${A.rows.filter(x=>x.st==='amb').length} open</span>`}
  else if(act==='asst-accept'){A.rows[Number(el.dataset.i)].st='ok';rerender()}
  else if(act==='asst-validate'){A.validated=true;rerender();$('.validate-line [role=status]')?.focus?.()}
  else if(act==='asst-ask'){const q=el.dataset.q;A.msgs.push({who:'you',text:el.textContent});push(q,()=>{if(q==='q-agent'){const r=A.rows.find(x=>x.t==='session.agent');r.src='"swe-agent"';r.st='ok';r.why='Constant chosen by you in the conversation.'}});rerender();scrollChat()}
  else if(act==='asst-form'){ev.preventDefault();const ta=$('#chat-text');const t=ta.value.trim();if(!t)return;A.msgs.push({who:'you',text:t});const k=/agent/i.test(t)?'q-agent':/last|token|usage/i.test(t)?'q-last':/time|stamp|when/i.test(t)?'q-time':'other';push(k,()=>{if(k==='q-agent'){const r=A.rows.find(x=>x.t==='session.agent');r.src='"swe-agent"';r.st='ok';r.why='Constant chosen by you in the conversation.'}});rerender();scrollChat();$('#chat-text')?.focus()}
  else if(act==='asst-preview'){A.previewing=true;rerender();setTimeout(()=>{A.previewing=false;A.step=4;rerender()},900)}
  else if(act==='asst-save-only'){A.step=1;A.got=false;A.rows=null;A.msgs=[];go('#/import')}
  else if(act==='asst-save'){A.saving=true;A.saveProgress=0;rerender();const t=setInterval(()=>{A.saveProgress=Math.min(100,(A.saveProgress||0)+8);rerender();if(A.saveProgress>=100){clearInterval(t);A.saving=false;S.justImported=SWE_IMPORT.id;Object.assign(A,{step:1,got:false,rows:null,msgs:[],validated:false});go('#/imports/'+SWE_IMPORT.id)}},120)}
}

function definitionsPage(){

   <div class="tbl"><table><caption class="sr">Metric definitions</caption><thead><tr><th>Metric</th><th>Definition</th><th>Unit</th><th>Semantics</th><th>Comparability</th></tr></thead><tbody>

const POPS={
 'def-sessions':{h:'Sessions',p:[METRICS.sessions.def],foot:'#/definitions'},
 'def-model-calls':{h:'Model calls',p:[METRICS.model_calls.def],foot:'#/definitions'},
 'def-input':{h:'Input tokens',p:[METRICS.input_tokens.def,`Exact value ${fmt(METRICS.input_tokens.v)} tokens. By semantics: tracelab-claude ${fmt(479945445)}, tracelab-codex ${fmt(73502432)}.`],foot:'#/definitions'},
 'def-output':{h:'Output tokens',p:[METRICS.output_tokens.def,`Exact value ${fmt(METRICS.output_tokens.v)} tokens over 4,741 of 4,770 calls.`],foot:'#/definitions'},
 'def-entities':{h:'Records and observations',p:['A source record is one line or row of the file. An observation is one session, model call or tool call the mapping emits from it. A TraceLab record emits one model call and one tool call per <code>tools[]</code> entry, and contributes to one session.']},
 'def-warnings':{h:'null and absent',p:['<b>absent</b>: the key was not in the record. <b>null</b>: the key was there with a null value. Both are stored as missing, never as 0 or "", and are counted separately so a schema change in the source is visible.','A field marked <i>required</i> in the mapping rejects the record instead.']},
 'def-outcomes':{h:'Record outcomes',p:['<b>accepted</b>: every rule applied. <b>partial</b>: accepted with at least one tolerated warning. <b>duplicate</b>: same bytes already committed for this source, nothing inserted. <b>rejected</b>: a rule refused it, reason recorded. <b>ignored</b>: no rule matched the record.']},
 'def-quality':{h:'Quality strip',p:['Counts things that reduce what the KPIs can claim: rejected records, model calls without a usage block (excluded from token sums), tool calls without a timestamp, and tool calls without an enclosing model call. Each links to the rows behind the count.']},
 'def-span':{h:'Declared vs observed',p:['<b>Declared</b> is an interval the source states for the session. <b>Observed</b> is the earliest and latest accepted child timestamp. They are shown side by side and never merged; a reversed declared interval is reported as a diagnostic, not corrected.']},
 'fmt-sniff':{h:'Format detection',p:['The first bytes identify gzip; the decompressed stream is JSON Lines because each line parses as one object. Parquet is identified by its footer magic. Detection never rewrites the file.']},
};
let popAnchor=null;
function openPop(btn){
  const id=btn.dataset.pop;const P=POPS[id];if(!P)return;const pop=$('#pop');
  if(popAnchor===btn){closePop();return}
  closePop();popAnchor=btn;btn.setAttribute('aria-expanded','true');
  pop.innerHTML=`<h3 id="pop-title">${P.h}</h3>${P.p.map(x=>`<p class="small">${x}</p>`).join('')}${P.foot?`<div class="foot"><a href="${P.foot}">All definitions</a></div>`:''}`;
  pop.setAttribute('aria-labelledby','pop-title');pop.hidden=false;
  const r=btn.getBoundingClientRect();const pw=pop.offsetWidth;let left=r.left+window.scrollX;if(left+pw>window.scrollX+document.documentElement.clientWidth-16)left=window.scrollX+document.documentElement.clientWidth-16-pw;
  pop.style.top=(r.bottom+window.scrollY+8)+'px';pop.style.left=left+'px';pop.setAttribute('tabindex','-1');pop.focus();
}
function closePop(){const pop=$('#pop');if(!pop||pop.hidden)return;pop.hidden=true;if(popAnchor){popAnchor.setAttribute('aria-expanded','false');popAnchor.focus();popAnchor=null}}

/* =========================================================

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el){if(!ev.target.closest('#pop'))closePop();const tr=ev.target.closest('tr.link');if(tr&&!ev.target.closest('a,button'))go(tr.dataset.href);return}
  const act=el.dataset.act;
  if(act.startsWith('imp-'))return impActions(act,el);
  if(act.startsWith('asst-')&&act!=='asst-form'&&act!=='asst-edit')return asstActions(act,el,ev);
  if(act==='pop')return openPop(el);
  if(act==='drawer-close')return $('#drawer').close();
  if(act==='source')return openSource(el.dataset.loc);
  if(act==='reject-payload'){const {parts}=parse();const imp=[...IMPORTS,SWE_IMPORT].find(x=>x.id===parts[1]);const rows=imp.rejects.filter(x=>!S.rep.code||x.code===S.rep.code);return openPayload(imp,imp.rejects.indexOf(rows[Number(el.dataset.i)]))}
  if(act==='chart'){S.dash.chip={kind:el.dataset.kind,key:el.dataset.key};rerender();const t=$('#sessions');if(t){t.scrollIntoView({behavior:'smooth',block:'start'});}return}
  if(act==='chip-clear'){S.dash.chip=null;rerender();return}
  if(act==='retry'){S.demo='sample';$('#demo').value='sample';rerender();return}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#pop').hidden){closePop();ev.preventDefault()}
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.bar[data-act=chart]')){ev.preventDefault();ev.target.click()}
  if(ev.key==='Enter'&&ev.target.matches('#chat-text')&&!ev.shiftKey){ev.preventDefault();asstActions('asst-form',ev.target.form,ev)}
});
document.addEventListener('input',ev=>{const el=ev.target;if(el.dataset.act==='asst-edit')asstActions('asst-edit',el,ev)});
document.addEventListener('change',ev=>{const el=ev.target;const act=el.dataset.act;
  if(el.id==='demo'){S.demo=el.value;S.imp.upload=null;S.imp.step=1;S.imp.mapping=null;S.imp.preview=null;rerender();return}
  if(act==='imp-pick')return impActions(act,el);
  if(act==='dash-filter'){S.dash[el.dataset.name]=el.value;rerender();return}
  if(act==='reject-code'){S.rep.code=el.value;rerender();return}
});
document.addEventListener('submit',ev=>{const f=ev.target.closest('[data-act=asst-form]');if(f)asstActions('asst-form',f,ev)});
$('#drawer').addEventListener('click',ev=>{if(ev.target===ev.currentTarget)ev.currentTarget.close()});

route();
