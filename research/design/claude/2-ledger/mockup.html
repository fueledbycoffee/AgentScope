<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentScope Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  --paper: #FCFCFA;
  --paper-2: #F3F3EF;
  --paper-3: #E8E8E2;
  --ink: #191C22;
  --ink-2: #555B66;
  --ink-3: #8A8F99;
  --rule: #DADBD5;
  --rule-2: #AEB0A8;
  --accent: #1E4B94;
  --accent-ink: #163A74;
  --accent-wash: #EDF1F8;
  --good: #1D6B49;
  --good-wash: #E7F1EB;
  --warn: #8A5A00;
  --warn-wash: #FAF2DF;
  --bad: #A4281E;
  --bad-wash: #FAE9E6;
  --focus: #1E4B94;
  --scrim: rgba(25, 28, 34, .38);
  --shadow: 0 1px 2px rgba(25,28,34,.06), 0 8px 24px rgba(25,28,34,.10);

  --serif: 'IBM Plex Serif', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

  --t0: 11px; --t1: 12px; --t2: 13px; --t3: 14px; --t4: 16px; --t5: 20px; --t6: 26px; --t7: 34px;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --col: 1120px; --measure: 66ch; --r: 3px;
}

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--paper); color: var(--ink); font: 400 var(--t3)/1.5 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body { margin: 0; min-height: 100vh; }
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 500; margin: 0; line-height: 1.25; letter-spacing: -.005em; }
h1 { font-size: var(--t7); letter-spacing: -.015em; }
h2 { font-size: var(--t5); }
h3 { font-size: var(--t4); }
p { margin: 0; }
a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .18em; }
a:hover { color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: .92em; }
.num, td.num, th.num, .figure { font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: var(--s4); top: -60px; background: var(--paper); padding: var(--s2) var(--s3); border: 1px solid var(--rule-2); z-index: 20; }
.skip:focus { top: var(--s3); }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- masthead ---------- */
.masthead { border-bottom: 1px solid var(--rule); background: var(--paper); }
.masthead .in { max-width: var(--col); margin: 0 auto; padding: 0 var(--s6); display: flex; align-items: baseline; gap: var(--s6); min-height: 52px; }
.brand { font-family: var(--serif); font-size: var(--t4); font-weight: 600; color: var(--ink); text-decoration: none; letter-spacing: -.01em; padding: var(--s3) 0; }
.brand span { font-weight: 400; color: var(--ink-2); }
.masthead nav { display: flex; gap: var(--s5); flex-wrap: wrap; }
.masthead nav a { color: var(--ink-2); text-decoration: none; padding: var(--s3) 0; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: var(--t3); }
.masthead nav a:hover { color: var(--ink); }
.masthead nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }

/* ---------- document ---------- */
main { max-width: var(--col); margin: 0 auto; padding: var(--s7) var(--s6) var(--s8); }
main:focus { outline: none; }
.doc-head { display: grid; grid-template-columns: 1fr auto; gap: var(--s4) var(--s6); align-items: end; padding-bottom: var(--s5); border-bottom: 1px solid var(--ink); margin-bottom: var(--s6); }
.doc-head .lede { color: var(--ink-2); max-width: var(--measure); margin-top: var(--s2); font-family: var(--serif); font-size: var(--t4); line-height: 1.55; }
.doc-head .meta { font-size: var(--t2); color: var(--ink-2); text-align: right; line-height: 1.6; }
.doc-head .meta b { font-weight: 500; color: var(--ink); }
section.part { margin-top: var(--s7); }
section.part > h2 { padding-bottom: var(--s2); border-bottom: 1px solid var(--rule); margin-bottom: var(--s4); display: flex; align-items: baseline; flex-wrap: wrap; gap: 0; }
section.part > h2 .aside { font-family: var(--sans); font-size: var(--t2); color: var(--ink-2); font-weight: 400; margin-left: auto; padding-left: var(--s4); }
.prose { max-width: var(--measure); font-family: var(--serif); font-size: 15px; line-height: 1.6; }
.prose + .prose { margin-top: var(--s3); }
.muted { color: var(--ink-2); }
.small { font-size: var(--t2); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s6); }
.actions { display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap; margin-top: var(--s5); }
.actions .spacer { flex: 1; }
hr.thin { border: 0; border-top: 1px solid var(--rule); margin: var(--s5) 0; }

/* ---------- footnotes ---------- */
.fn { display: inline-block; vertical-align: super; font-size: .68em; line-height: 1; padding: 0 .18em; margin-left: .08em; border: 0; background: none; color: var(--accent); cursor: pointer; font-family: var(--sans); font-weight: 500; border-radius: 2px; }
.fn:hover, .fn[aria-expanded="true"] { background: var(--accent-wash); }
.pop-wrap { position: relative; display: inline; }
.pop { position: absolute; z-index: 30; top: calc(100% + 6px); left: 0; width: 360px; max-width: min(360px, calc(100vw - 48px)); background: var(--paper); border: 1px solid var(--rule-2); box-shadow: var(--shadow); padding: var(--s4); font-family: var(--sans); font-size: var(--t2); line-height: 1.5; text-align: left; font-weight: 400; vertical-align: baseline; font-variant-numeric: normal; }
.pop.right { left: auto; right: 0; }
.pop h4 { font-family: var(--sans); font-size: var(--t2); font-weight: 600; margin-bottom: var(--s1); }
.pop dl { margin: var(--s3) 0 0; display: grid; grid-template-columns: auto 1fr; gap: var(--s1) var(--s3); }
.pop dt { color: var(--ink-2); }
.pop dd { margin: 0; }
.pop .links { display: flex; gap: var(--s4); margin-top: var(--s3); padding-top: var(--s3); border-top: 1px solid var(--rule); }
.notes { margin-top: var(--s8); padding-top: var(--s4); border-top: 1px solid var(--ink); max-width: var(--measure); }
.notes h2 { font-size: var(--t4); margin-bottom: var(--s3); }
.notes ol { margin: 0; padding-left: 1.6em; font-size: var(--t2); line-height: 1.55; color: var(--ink-2); }
.notes li { padding-left: .3em; margin-bottom: var(--s2); }
.notes li.hilite { color: var(--ink); background: var(--accent-wash); outline: 6px solid var(--accent-wash); }
.notes li:focus { outline: 2px solid var(--focus); outline-offset: 4px; }
.notes b { color: var(--ink); font-weight: 500; }

/* ---------- statements & tables ---------- */
.stmt { width: 100%; border-collapse: collapse; font-size: var(--t3); }
.stmt caption { text-align: left; font-family: var(--serif); font-size: var(--t4); font-weight: 500; padding-bottom: var(--s3); }
.stmt caption .sub { display: block; font-family: var(--sans); font-size: var(--t2); color: var(--ink-2); font-weight: 400; margin-top: 2px; }
.stmt th, .stmt td { text-align: left; padding: var(--s2) var(--s2); border-bottom: 1px solid var(--rule); vertical-align: top; }
.stmt th { font-weight: 500; font-size: var(--t1); color: var(--ink-2); letter-spacing: .01em; }
.stmt td.num, .stmt th.num { text-align: right; white-space: nowrap; }
.stmt tr.total td { border-top: 1px solid var(--ink); border-bottom: 3px double var(--ink); font-weight: 500; }
.stmt tr.total td.num { font-family: var(--serif); font-size: var(--t4); }
.stmt td:first-child, .stmt th:first-child { padding-left: 0; }
.stmt td:last-child, .stmt th:last-child { padding-right: 0; }
.stmt .desc { color: var(--ink-2); font-size: var(--t2); }
.stmt tbody tr:hover td { background: var(--paper-2); }
.stmt tr.total:hover td { background: transparent; }
.tbl-wrap { overflow-x: auto; margin: 0 calc(-1 * var(--s2)); padding: 0 var(--s2); }
.cell-id { font-family: var(--mono); font-size: var(--t1); white-space: nowrap; }
.hash { font-family: var(--mono); font-size: var(--t1); overflow-wrap: anywhere; line-height: 1.45; }
.hash .grp { margin-right: .35em; }
.skel td { color: transparent; }
.skel td::before { content: ''; display: block; height: 12px; width: 70%; background: var(--paper-3); border-radius: 2px; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* figures (KPI statement) */
.figures { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); }
.figure-cell { padding: var(--s4) var(--s4) var(--s4) 0; border-right: 1px solid var(--rule); margin-right: var(--s4); }
.figure-cell:last-child { border-right: 0; margin-right: 0; }
.figure-cell h3 { font-family: var(--sans); font-size: var(--t2); font-weight: 500; color: var(--ink-2); }
.figure-cell .figure { font-family: var(--serif); font-size: var(--t6); font-weight: 500; line-height: 1.2; margin: var(--s2) 0 var(--s1); letter-spacing: -.01em; overflow-wrap: anywhere; }
.figure-cell .figure.na { color: var(--ink-2); font-style: italic; font-weight: 400; }
.figure-cell .cov { font-size: var(--t1); color: var(--ink-2); }
.figure-cell .cov.zero { color: var(--warn); }

/* status stamps */
.stamp { display: inline-flex; align-items: center; gap: 6px; font-size: var(--t2); font-weight: 500; white-space: nowrap; }
.stamp::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.stamp.committed { color: var(--good); }
.stamp.duplicate { color: var(--ink-2); }
.stamp.failed { color: var(--bad); }
.stamp.running { color: var(--accent); }
.stamp.running::before { animation: pulse 1s ease-in-out infinite; }
.stamp.big { font-family: var(--serif); font-size: var(--t5); font-weight: 500; gap: 10px; }
.stamp.big::before { width: 11px; height: 11px; }

/* notices */
.notice { border-left: 3px solid var(--ink); background: var(--paper-2); padding: var(--s3) var(--s4); font-size: var(--t2); line-height: 1.5; max-width: 760px; }
.notice + .notice { margin-top: var(--s3); }
.notice b { font-weight: 600; }
.notice.warn { border-color: var(--warn); background: var(--warn-wash); }
.notice.bad { border-color: var(--bad); background: var(--bad-wash); }
.notice.good { border-color: var(--good); background: var(--good-wash); }
.notice p + p { margin-top: var(--s2); }
.notice .code { font-family: var(--mono); font-size: var(--t1); color: var(--ink-2); }

/* controls */
.btn { font-family: var(--sans); font-size: var(--t2); font-weight: 500; padding: 7px 12px; border: 1px solid var(--rule-2); background: var(--paper); color: var(--ink); border-radius: var(--r); cursor: pointer; line-height: 1.3; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.primary:hover { background: #000; }
.btn.quiet { border-color: transparent; color: var(--accent); padding-left: 6px; padding-right: 6px; }
.btn.quiet:hover { background: var(--accent-wash); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 3px 8px; font-size: var(--t1); }
label.field { display: block; font-size: var(--t2); font-weight: 500; margin-bottom: var(--s1); }
.hint { font-size: var(--t1); color: var(--ink-2); margin-top: var(--s1); }
input[type=text], input[type=search], input[type=date], select, textarea { background: var(--paper); border: 1px solid var(--rule-2); border-radius: var(--r); padding: 6px 9px; font-size: var(--t2); min-height: 32px; }
select { padding-right: 24px; }
input:hover, select:hover, textarea:hover { border-color: var(--ink-3); }
.row { display: flex; gap: var(--s4); align-items: end; flex-wrap: wrap; }
.field-group { min-width: 160px; }
.invalid { border-color: var(--bad) !important; }
.err { color: var(--bad); font-size: var(--t1); margin-top: var(--s1); }
.status-line { font-size: var(--t2); color: var(--ink-2); display: flex; align-items: center; gap: var(--s2); min-height: 20px; }
.status-line::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1s ease-in-out infinite; }
.status-line:empty { display: none; }

/* dropzone */
.drop { border: 1px dashed var(--rule-2); border-radius: var(--r); padding: var(--s6) var(--s5); display: flex; gap: var(--s5); align-items: center; justify-content: space-between; background: var(--paper); }
.drop:hover { border-color: var(--ink); }
.drop .t { font-family: var(--serif); font-size: var(--t4); }

/* definition lists */
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--s2) var(--s5); font-size: var(--t2); margin: 0; align-content: start; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }

/* journal (imports history) */
.journal { width: 100%; border-collapse: collapse; }
.journal th { text-align: left; white-space: nowrap; font-size: var(--t1); font-weight: 500; color: var(--ink-2); padding: var(--s2) var(--s2); border-bottom: 1px solid var(--ink); }
.journal th.num { text-align: right; }
.journal td { padding: var(--s3) var(--s2); border-bottom: 1px solid var(--rule); vertical-align: top; font-size: var(--t2); }
.journal td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.journal td:first-child, .journal th:first-child { padding-left: 0; }
.journal .date { white-space: nowrap; color: var(--ink-2); }
.journal .date b { display: block; color: var(--ink); font-weight: 500; }
.journal .entry summary { list-style: none; cursor: pointer; display: flex; gap: var(--s2); align-items: baseline; }
.journal .entry summary::-webkit-details-marker { display: none; }
.journal .entry summary::before { content: ''; width: 0; height: 0; border-left: 5px solid var(--ink-3); border-top: 4px solid transparent; border-bottom: 4px solid transparent; flex: none; transform: translateY(-1px); transition: transform .12s; }
.journal .entry[open] summary::before { transform: rotate(90deg) translateX(-1px); }
.journal .entry summary .title { font-weight: 500; }
.journal .entry summary .sub { color: var(--ink-2); }
.journal .entry .body { margin: var(--s3) 0 var(--s1) 13px; padding: var(--s3) var(--s4); background: var(--paper-2); display: grid; grid-template-columns: 1fr 1fr; gap: var(--s3) var(--s6); }
.journal .neg { color: var(--bad); }
.journal .zero { color: var(--ink-3); }
.progress { height: 4px; background: var(--paper-3); border-radius: 2px; overflow: hidden; margin-top: var(--s2); }
.progress > span { display: block; height: 100%; background: var(--accent); }

/* charts */
.charts { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: var(--s6); margin-top: var(--s4); }
.chart h3 { font-family: var(--sans); font-size: var(--t2); font-weight: 500; color: var(--ink-2); margin-bottom: var(--s2); }
.chart svg { width: 100%; height: auto; display: block; font-family: var(--sans); }
.chart .bar { fill: var(--ink); }
.chart a:hover .bar, .chart a:focus-visible .bar { fill: var(--accent); }
.chart a:focus-visible { outline: none; }
.chart a:focus-visible .bar { stroke: var(--accent); stroke-width: 2px; }
.chart .axis { stroke: var(--rule-2); }
.chart .grid { stroke: var(--rule); }
.chart a { text-decoration: none; }
.chart text { fill: var(--ink-2); font-size: 12px; }
.chart text.val { fill: var(--ink); font-variant-numeric: tabular-nums; }
.chart .hbar { fill: var(--ink); }
.chart .hrow:hover .hbar, .chart .hrow:focus-visible .hbar { fill: var(--accent); }
.chart .foot { font-size: var(--t1); color: var(--ink-2); margin-top: var(--s2); }

/* quality strip */
.quality { display: flex; gap: var(--s6); flex-wrap: wrap; font-size: var(--t2); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: var(--s3) 0; margin-top: var(--s5); }
.quality div b { font-weight: 500; font-variant-numeric: tabular-nums; }
.quality .warn b { color: var(--warn); }

/* scope line */
.scope { display: flex; gap: var(--s3); align-items: baseline; flex-wrap: wrap; font-size: var(--t2); color: var(--ink-2); }
.scope b { font-weight: 500; color: var(--ink); }
.scope-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s3); padding: var(--s4); border: 1px solid var(--rule-2); box-shadow: var(--shadow); background: var(--paper); position: absolute; z-index: 25; width: 640px; max-width: calc(100vw - 48px); }
.scope-form .foot { grid-column: 1 / -1; display: flex; gap: var(--s2); justify-content: flex-end; }

/* sheet (provenance) */
dialog.sheet { position: fixed; inset: 0 0 0 auto; margin: 0; width: min(600px, 100vw); max-width: 100vw; height: 100dvh; max-height: 100dvh; border: 0; border-left: 1px solid var(--rule-2); background: var(--paper); color: var(--ink); padding: 0; box-shadow: var(--shadow); }
dialog.sheet::backdrop { background: var(--scrim); }
dialog.sheet[open] { animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
.sheet-head { display: flex; justify-content: space-between; align-items: baseline; padding: var(--s4) var(--s5); border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--paper); }
.sheet-head h2 { font-size: var(--t5); }
.sheet-body { padding: var(--s4) var(--s5) var(--s6); overflow: auto; height: calc(100dvh - 58px); }
.chain { list-style: none; margin: 0; padding: 0; counter-reset: step; }
.chain > li { position: relative; padding: var(--s3) 0 var(--s3) 40px; border-bottom: 1px solid var(--rule); counter-increment: step; }
.chain > li::before { content: counter(step); position: absolute; left: 0; top: 13px; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule-2); display: grid; place-items: center; font-size: var(--t1); color: var(--ink-2); background: var(--paper); font-variant-numeric: tabular-nums; }
.chain > li[aria-current="step"]::before { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chain > li::after { content: ''; position: absolute; left: 12px; top: 38px; bottom: -1px; border-left: 1px solid var(--rule); }
.chain > li:last-child::after { display: none; }
.chain h3 { font-family: var(--sans); font-size: var(--t2); font-weight: 600; }
.chain h3 .what { font-weight: 400; color: var(--ink-2); }
.chain .b { font-size: var(--t2); margin-top: var(--s1); line-height: 1.5; }
.chain .b .kv { margin-top: var(--s2); font-size: var(--t1); }
.chain li.compact .b { display: none; }
.chain li.compact { padding-top: var(--s2); padding-bottom: var(--s2); }
.chain li.compact h3 { font-weight: 400; color: var(--ink-2); }
.raw { font-family: var(--mono); font-size: var(--t1); line-height: 1.5; white-space: pre; overflow: auto; background: var(--paper-2); border: 1px solid var(--rule); padding: var(--s3) var(--s4); margin: var(--s2) 0 0; max-height: 46vh; tab-size: 2; }
.raw mark { background: var(--warn-wash); color: inherit; outline: 1px solid var(--warn); }

/* rejects browser */
details.payload summary { cursor: pointer; color: var(--accent); font-size: var(--t1); list-style: none; }
details.payload summary::-webkit-details-marker { display: none; }
details.payload pre { margin-top: var(--s2); max-height: 240px; }

/* mapping assistant */
.assist { display: grid; grid-template-columns: 1fr 332px; gap: var(--s6); align-items: start; }
.convo { border: 1px solid var(--rule); background: var(--paper); position: sticky; top: var(--s4); display: flex; flex-direction: column; max-height: calc(100vh - 32px); }
.convo h2 { font-size: var(--t4); padding: var(--s3) var(--s4); border-bottom: 1px solid var(--rule); }
.convo .log { padding: var(--s3) var(--s4); overflow: auto; flex: 1; display: flex; flex-direction: column; gap: var(--s3); font-size: var(--t2); line-height: 1.5; }
.convo .msg { padding: var(--s2) var(--s3); border-radius: var(--r); max-width: 92%; }
.convo .msg.you { align-self: flex-end; background: var(--paper-2); }
.convo .msg.asst { border-left: 2px solid var(--ink); padding-left: var(--s3); }
.convo .msg .who { font-size: var(--t0); color: var(--ink-2); margin-bottom: 2px; }
.convo .msg p + p { margin-top: var(--s2); }
.convo form { padding: var(--s3) var(--s4); border-top: 1px solid var(--rule); display: grid; gap: var(--s2); }
.convo textarea { resize: vertical; min-height: 56px; }
.convo .foot { font-size: var(--t0); color: var(--ink-2); }
.map td select, .map td input { min-height: 26px; padding: 2px 6px; font-size: var(--t1); font-family: var(--mono); }
.map { table-layout: fixed; }

  { target: 'model_call.model', src: '$.model', tf: 'trim', why: 'One model per conversation, not per turn.', amb: 'Turns do not carry a model; all turns inherit the conversation model.' },
  { target: 'model_call.input_tokens', src: '$.usage.prompt_tokens', tf: 'int (strict)', why: '12 rows hold a formatted string ("12,431"). Strict parsing rejects them instead of guessing.', amb: '' },
  { target: 'model_call.output_tokens', src: '$.usage.completion_tokens', tf: 'int (strict)', why: 'Integer in every sampled row.', amb: '' },

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const n = v => v == null ? '<span class="muted"><i>Unavailable</i></span>' : Number(v).toLocaleString('en-US');
const ts = s => s ? s.replace('T', ' ').replace('Z', ' UTC') : '<span class="muted"><i>Unavailable</i></span>';
const dateOnly = s => s.slice(0, 10);
const timeOnly = s => s.slice(11, 19) + ' UTC';
const hash = h => `<span class="hash" title="SHA-256, full">${h.match(/.{1,8}/g).map(g => `<span class="grp">${g}</span>`).join('')}</span>`;
const shortId = id => `<span class="cell-id" title="${esc(id)}">${esc(id)}</span>`;
const stamp = s => `<span class="stamp ${s}">${s[0].toUpperCase() + s.slice(1)}</span>`;
const abbr = v => v >= 1e9 ? (v / 1e9).toFixed(1).replace(/\.0$/, '') + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : String(v);
const sum = a => a.reduce((x, y) => x + y, 0);

/* Footnote registry per page: markers are numbered in order of first use. */
function noteBook() {
  const used = [];
  return {
    fn(key, extra = {}) {
      let i = used.indexOf(key); if (i < 0) { used.push(key); i = used.length - 1; }
      const cov = extra.cov ? ` data-cov="${esc(extra.cov)}"` : '';
      const prov = extra.prov ? ` data-provkey="${esc(extra.prov)}"` : '';
      return `<span class="pop-wrap"><button type="button" class="fn" data-note="${key}" aria-expanded="false" aria-label="Note ${i + 1}: ${esc(NOTES[key].title)}"${cov}${prov}>${i + 1}</button></span>`;
    },
    render() {
      if (!used.length) return '';
      return `<section class="notes" aria-labelledby="notes-h"><h2 id="notes-h">Notes</h2><ol>${used.map(k => `<li id="note-${k}"><b>${esc(NOTES[k].title)}.</b> ${esc(NOTES[k].text)}</li>`).join('')}</ol></section>`;
    },
  };
}

function docHead(title, lede, meta) {
  return `<div class="doc-head"><div><h1>${title}</h1>${lede ? `<p class="lede">${lede}</p>` : ''}</div>${meta ? `<div class="meta">${meta}</div>` : ''}</div>`;
}
function skeleton(cols, rows = 5) {
  return Array.from({ length: rows }, () => `<tr class="skel" aria-hidden="true">${Array.from({ length: cols }, () => '<td>&nbsp;</td>').join('')}</tr>`).join('');
}
function loadingDoc(title, what) {
  return docHead(title) + `<p class="status-line" role="status">Loading ${what}…</p><div class="tbl-wrap" style="margin-top:24px"><table class="stmt" aria-hidden="true"><caption><span class="vh">Loading</span></caption><tbody>${skeleton(5, 6)}</tbody></table></div>`;
}
function errorDoc(title, code, message, details) {
  return docHead(title) + `<div class="notice bad" role="alert"><p><b>Could not load this page.</b> ${esc(message)}</p><p class="code">error.code ${esc(code)}${details ? ' · ' + esc(details) : ''}</p><div class="actions" style="margin-top:12px"><button class="btn sm" type="button" onclick="render()">Try again</button><a class="btn sm" href="#/imports" style="text-decoration:none">Go to imports</a></div></div>`;
}

function renderImports(mock) {
  const N = noteBook();
  if (mock === 'loading') return loadingDoc('Imports', 'the import journal');
  if (mock === 'error') return errorDoc('Imports', 'internal_error', 'The server could not read the import journal.', 'sqlite3.OperationalError: database is locked');
  const list = mock === 'empty' ? [] : IMPORTS;
  let h = docHead('Imports', 'Every import attempt, newest first, with what it committed. A duplicate or failed entry changes nothing and stays in the journal.', `<b>${list.length}</b> entries<br>Sessions held${N.fn('balance')} <b>2,068</b>`);
  if (!list.length) {
    return h + `<div class="empty"><h3>No imports yet.</h3><p>The journal fills as files are imported. Each entry records the bytes, the mapping revision and every outcome, and stays here even when nothing was inserted.</p><div class="actions"><a class="btn primary" href="#/import" style="text-decoration:none">Import a trace file</a></div></div>` + N.render();
  }
  h += `<div class="tbl-wrap"><table class="journal"><caption class="vh">Import attempts, newest first</caption><thead><tr>
    <th scope="col">Date</th><th scope="col">Entry</th><th scope="col">Status</th><th scope="col" class="num">Accepted</th><th scope="col" class="num">Rejected</th><th scope="col" class="num">Observations</th><th scope="col" class="num">Sessions held${N.fn('balance')}</th></tr></thead><tbody>`;
  for (const im of list) {
    const obs = Object.values(im.entities).length ? sum(Object.values(im.entities)) : 0;
    const acc = im.status === 'running' ? `${n(im.records.accepted)} <span class="muted">of ${n(im.total)}</span>` : n(im.records.accepted);
    h += `<tr><td class="date"><b>${dateOnly(im.at)}</b>${timeOnly(im.at)}</td>
      <td><details class="entry"><summary><span><span class="title">${esc(im.file)}</span> <span class="sub">${im.source}, ${im.mapping.name} rev ${im.mapping.rev}</span><br><a href="#/imports/${im.id}" class="cell-id" onclick="event.stopPropagation()">${im.id}</a></span></summary>
        <div class="body">
          <dl class="kv"><dt>SHA-256</dt><dd>${hash(im.sha)}</dd><dt>Size</dt><dd class="num">${n(im.size)} bytes, ${im.format}</dd><dt>Mapping</dt><dd><span class="mono">${im.mapping.id}</span></dd></dl>
          <dl class="kv"><dt>Records</dt><dd class="num">accepted ${n(im.records.accepted)}, partial ${n(im.records.partial)}, duplicate ${n(im.records.duplicate)}, rejected ${n(im.records.rejected)}, ignored ${n(im.records.ignored)}</dd>
          <dt>Entities</dt><dd class="num">${obs ? `sessions ${n(im.entities.session)}, model calls ${n(im.entities.model_call)}, tool calls ${n(im.entities.tool_call)}` : 'none emitted'}</dd>
          ${im.error ? `<dt>Error</dt><dd class="mono small" style="color:var(--bad)">${esc(im.error)}</dd>` : ''}
          ${im.of ? `<dt>Same bytes as</dt><dd><a href="#/imports/${im.of}">${im.of}</a></dd>` : ''}
          ${im.status === 'running' ? `<dt>Progress</dt><dd class="num">${n(im.progress)} of ${n(im.total)} records read<div class="progress" role="progressbar" aria-valuenow="${im.progress}" aria-valuemin="0" aria-valuemax="${im.total}" aria-label="Import progress"><span style="width:${(im.progress / im.total * 100).toFixed(1)}%"></span></div></dd>` : ''}
          <dt>Report</dt><dd><a href="#/imports/${im.id}">Open the full report</a></dd></dl>
        </div></details></td>
      <td>${stamp(im.status)}</td>
      <td class="num">${acc}</td>
      <td class="num ${im.records.rejected ? 'neg' : 'zero'}">${n(im.records.rejected)}</td>
      <td class="num ${obs ? '' : 'zero'}">${n(obs)}</td>
      <td class="num">${im.balance == null ? '<span class="muted">pending</span>' : n(im.balance)}</td></tr>`;
  }
  h += `</tbody></table></div>`;
  return h + N.render();
}

function renderReport(id, mock) {
  const N = noteBook();
  if (mock === 'loading') return loadingDoc('Import report', 'the report');
  if (mock === 'error' || !IMPORTS.some(i => i.id === id)) return errorDoc('Import report', 'not_found', `No import has the id ${id}.`);
  const im = IMPORTS.find(i => i.id === id);
  const rej = mock === 'empty' ? [] : (im.id === 'imp_7c0e51a2b9d4e6f8a013' ? REJECTS_SWE : []);
  const meta = `${stamp(im.status).replace('class="stamp', 'class="stamp big')}<br>${im.finished ? `Finished ${ts(im.finished)}` : `Started ${ts(im.at)}`}`;
  let h = docHead(`Import ${im.id}`, `${esc(im.file)} into source <b>${im.source}</b> with ${im.mapping.name} revision${N.fn('revision')} ${im.mapping.rev}.`, meta);

  if (im.status === 'duplicate') h += `<div class="notice"><p><b>Nothing was inserted.</b> These bytes were already committed for ${im.source} by <a href="#/imports/${im.of}">${im.of}</a>. Every record is reported as duplicate${N.fn('duplicate')}; the ledger is unchanged.</p></div>`;
  if (im.status === 'failed') h += `<div class="notice bad" role="alert"><p><b>The import failed and was rolled back.</b> Nothing was inserted.</p><p class="code">${esc(im.error)}</p><p>Records after line:2118 were not examined. Raise the bounded-iteration limit in a new mapping revision, or split the file.</p></div>`;
  if (im.status === 'running') h += `<div class="notice"><p><b>Running.</b> <span class="num">${n(im.progress)}</span> of <span class="num">${n(im.total)}</span> records read. This page updates as the import proceeds; the entry will read committed or failed when the transaction closes.</p><div class="progress" role="progressbar" aria-valuenow="${im.progress}" aria-valuemin="0" aria-valuemax="${im.total}" aria-label="Import progress"><span style="width:${(im.progress / im.total * 100).toFixed(1)}%"></span></div></div>`;

  const r = im.records;
  const recTotal = r.accepted + r.partial + r.duplicate + r.rejected + r.ignored;
  const e = im.entities;
  const obs = Object.values(e).length ? sum(Object.values(e)) : 0;
  h += `<section class="part" aria-labelledby="h-out"><h2 id="h-out">Outcome</h2><div class="two">
    <table class="stmt"><caption>Source records${N.fn('records')}<span class="sub">Each record has exactly one outcome</span></caption><tbody>
      <tr><td>Accepted</td><td class="num">${n(r.accepted)}</td></tr>
      <tr><td>Partial <span class="desc">— accepted with some fields Unavailable</span></td><td class="num">${n(r.partial)}</td></tr>
      <tr><td>Duplicate</td><td class="num">${n(r.duplicate)}</td></tr>
      <tr><td>Rejected ${rej.length ? `<a href="#rejects" class="small">see below</a>` : ''}</td><td class="num ${r.rejected ? 'neg' : ''}" style="${r.rejected ? 'color:var(--bad)' : ''}">${n(r.rejected)}</td></tr>
      <tr><td>Ignored <span class="desc">— matched no rule</span></td><td class="num">${n(r.ignored)}</td></tr>
      <tr class="total"><td>Records${im.status === 'running' ? ' so far' : ''}</td><td class="num">${n(recTotal)}</td></tr></tbody></table>
    <table class="stmt"><caption>Observations emitted<span class="sub">${obs ? 'One record can emit several observations' : 'None: nothing was committed'}</span></caption><tbody>
      <tr><td>Sessions${N.fn('sessions')}</td><td class="num">${obs ? n(e.session) : '—'}</td></tr>
      <tr><td>Model calls${N.fn('model_calls')}</td><td class="num">${obs ? n(e.model_call) : '—'}</td></tr>
      <tr><td>Tool calls${N.fn('tool_calls')}</td><td class="num">${obs ? n(e.tool_call) : '—'}</td></tr>
      <tr class="total"><td>Observations</td><td class="num">${obs ? n(obs) : '—'}</td></tr></tbody></table>
  </div></section>`;

  const w = im.warnings;
  h += `<section class="part" aria-labelledby="h-warn"><h2 id="h-warn">Warnings${N.fn('warnings')} <span class="aside">field-level, not rejections</span></h2>`;
  if (Object.keys(w).length) {
    h += `<table class="stmt" style="max-width:560px"><caption class="vh">Warnings by code</caption><tbody>
      ${w.absent != null ? `<tr><td>absent <span class="desc">— key missing; mostly cache_creation_tokens on codex rows</span></td><td class="num">${n(w.absent)}</td></tr>` : ''}
      ${w.null != null ? `<tr><td>null <span class="desc">— key present, value null; mostly output_tokens on interrupted calls</span></td><td class="num">${n(w.null)}</td></tr>` : ''}
      <tr class="total"><td>Warnings</td><td class="num">${n(sum(Object.values(w)))}</td></tr></tbody></table>`;
  } else h += `<p class="prose muted">No warnings were raised${im.status === 'committed' ? '' : ' before the import stopped'}.</p>`;
  h += `</section>`;

  h += `<section class="part" aria-labelledby="h-files"><h2 id="h-files">Files</h2><div class="tbl-wrap"><table class="stmt"><caption class="vh">Imported files</caption>
    <thead><tr><th scope="col">Filename</th><th scope="col">SHA-256${N.fn('sha256')}</th><th scope="col" class="num">Size</th><th scope="col">Format</th><th scope="col" class="num">Records</th></tr></thead>
    <tbody><tr><td>${esc(im.file)}</td><td style="max-width:360px">${hash(im.sha)}</td><td class="num">${n(im.size)} bytes</td><td>${im.format}</td><td class="num">${n(im.total)}</td></tr></tbody></table></div></section>`;

  h += `<section class="part" id="rejects" aria-labelledby="h-rej"><h2 id="h-rej">Rejects${N.fn('rejects')} <span class="aside">${n(r.rejected)} of ${n(recTotal)} records</span></h2>`;
  if (!r.rejected) h += `<p class="prose muted">No record was rejected. Every source record contributed to at least one observation.</p>`;
  else {
    const codes = [...new Set(REJECTS_SWE.map(x => x.code))];
    h += `<div class="row" style="margin-bottom:16px"><div class="field-group"><label class="field" for="rej-code">Code</label><select id="rej-code" data-act="rejfilter"><option value="">All codes (${r.rejected})</option>${codes.map(c => `<option value="${c}">${c} (${c === 'invalid_type' ? 9 : c === 'missing_required' ? 2 : 1})</option>`).join('')}</select></div><p class="hint" style="align-self:end">Showing the first ${rej.length} of ${r.rejected}. Payloads are the stored bytes, not re-serialised.</p></div>
    <div class="tbl-wrap"><table class="stmt" id="rej-table"><caption class="vh">Rejected records</caption><thead><tr><th scope="col">Locator</th><th scope="col">Rule</th><th scope="col">Path</th><th scope="col">Code</th><th scope="col">Message</th><th scope="col">Payload</th></tr></thead><tbody>${rejectRows(rej)}</tbody></table></div>`;
  }
  h += `</section>`;
  h += `<div class="actions"><a href="#/dashboard">Open the dashboard</a><a href="#/imports">Back to the journal</a></div>`;
  return h + N.render();
}
function rejectRows(rows) {
  if (!rows.length) return `<tr><td colspan="6" class="muted">No rejects with this code.</td></tr>`;
  return rows.map(x => `<tr data-code="${x.code}"><td class="mono">${x.locator}</td><td>${x.rule}</td><td class="mono small">${esc(x.path)}</td><td class="mono small">${x.code}</td><td>${esc(x.message)}</td><td><details class="payload"><summary>Show payload</summary><pre class="raw">${esc(x.payload)}</pre></details></td></tr>`).join('');
}

const dashUI = { scope: 'all', open: false };
function renderDashboard(mock) {
  const N = noteBook();
  if (mock === 'loading') return loadingDoc('Dashboard', 'metrics for the current scope');
  if (mock === 'error') return errorDoc('Dashboard', 'invalid_input', 'The period is not a valid range.', 'details[0].path period.to, message "2026-06-31 is not a date"');
  const d = DASH[dashUI.scope];
  let h = docHead('Dashboard', 'Four figures, three charts, one quality strip. Every figure carries its definition and its coverage; click a bar to reach the sessions behind it.', `As at <b>2026-09-07 11:42 UTC</b><br>Last committed entry <a href="#/imports/imp_7c0e51a2b9d4e6f8a013">imp_7c0e51a2…</a>`);

  if (mock === 'empty') return h + `<div class="empty"><h3>Nothing to report yet.</h3><p>The ledger holds no sessions. Import a trace file and the figures, charts and definitions appear here with their coverage.</p><div class="actions"><a class="btn primary" href="#/import" style="text-decoration:none">Import a trace file</a></div></div>` + N.render();

  h += `<div class="scope" style="position:relative"><span>Scope</span><b>${d.label}</b><button class="btn quiet sm" type="button" data-act="scope" aria-expanded="${dashUI.open}" aria-controls="scope-form">Change</button>
    ${dashUI.open ? `<form id="scope-form" class="scope-form" data-act="scopeform" style="top:28px;left:0">
      <div><label class="field" for="f-src">Source</label><select id="f-src"><option>All</option><option ${dashUI.scope === 'codex' ? 'selected' : ''}>tracelab</option><option>swe-chat</option></select></div>
      <div><label class="field" for="f-agent">Agent</label><select id="f-agent" name="agent"><option value="all">All</option><option value="claude-code">claude-code</option><option value="codex" ${dashUI.scope === 'codex' ? 'selected' : ''}>codex</option></select></div>
      <div><label class="field" for="f-model">Model</label><select id="f-model"><option>All</option><option>claude-opus-4-6</option><option>claude-opus-4-7</option><option>gpt-5.5-codex</option></select></div>
      <div><label class="field" for="f-from">Period</label><div style="display:flex;gap:6px"><input id="f-from" type="date" value="2026-06-01" aria-label="From"><input type="date" value="2026-06-30" aria-label="To"></div></div>
      <div class="foot"><button class="btn sm" type="button" data-act="scopeclose">Cancel</button><button class="btn primary sm" type="submit">Apply scope</button></div></form>` : ''}</div>`;

  const cov = (k, t) => `<p class="cov ${k === 0 ? 'zero' : ''}">Coverage${N.fn('coverage')} <span class="num">${n(k)} / ${n(t)}</span> calls</p>`;
  h += `<div class="figures" style="margin-top:16px" role="list">
    <div class="figure-cell" role="listitem"><h3>Sessions${N.fn('sessions', { prov: 'sessions' })}</h3><p class="figure num">${n(d.sessions)}</p><p class="cov">All sessions in scope</p></div>
    <div class="figure-cell" role="listitem"><h3>Model calls${N.fn('model_calls', { prov: 'model_calls' })}</h3><p class="figure num">${n(d.model_calls)}</p><p class="cov">Recorded observations</p></div>
    <div class="figure-cell" role="listitem"><h3>Input tokens${N.fn('input_tokens', { cov: `${n(d.input.known)} / ${n(d.input.total)} calls`, prov: 'input_tokens' })}</h3><p class="figure num">${n(d.input.value)}</p>${cov(d.input.known, d.input.total)}</div>
    <div class="figure-cell" role="listitem"><h3>Output tokens${N.fn('output_tokens', { cov: `${n(d.output.known)} / ${n(d.output.total)} calls`, prov: 'output_tokens' })}</h3><p class="figure num ${d.output.value == null ? 'na' : ''}">${d.output.value == null ? 'Unavailable' : n(d.output.value)}</p>${cov(d.output.known, d.output.total)}</div>
  </div>`;

  /* charts */
  const maxD = Math.max(...d.days, 1);
  const W = 640, H = 170, padL = 22, padB = 22, top = 10, bw = (W - padL) / 30;
  let bars = '';
  d.days.forEach((v, i) => {
    const x = padL + i * bw + 2, bh = v / maxD * (H - padB - top), y = H - padB - bh;
    const day = `2026-06-${String(i + 1).padStart(2, '0')}`;
    bars += `<a href="#/sessions?day=${day}" aria-label="${v} sessions on ${day}"><title>${day}: ${v} session${v === 1 ? '' : 's'}</title><rect class="bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - 4).toFixed(1)}" height="${bh.toFixed(1)}" ${v === 0 ? 'fill-opacity="0.15" ' : ''}/></a>`;
    if ((i + 1) % 5 === 0 || i === 0) bars += `<text x="${(x + (bw - 4) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${i + 1}</text>`;
  });
  const gridY = [0, Math.ceil(maxD / 2), maxD].map(v => { const y = H - padB - v / maxD * (H - padB - top); return `<line class="grid" x1="${padL}" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}"/><text x="${padL - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${v}</text>`; }).join('');
  const hbars = (rows, key, total, fmtv) => {
    const max = Math.max(...rows.map(r => r[1]), 1), rh = 24, lw = 96, vw = 70, w = 320;
    return `<svg viewBox="0 0 ${w} ${rows.length * rh}" role="img" aria-label="${key} chart">${rows.map(([name, v], i) => {
      const y = i * rh, bwid = (w - lw - vw) * v / max;
      return `<a class="hrow" href="#/sessions?${key}=${encodeURIComponent(name)}" aria-label="${name}: ${v.toLocaleString('en-US')}"><title>${name}: ${v.toLocaleString('en-US')} (${((v / total) * 100).toFixed(1)} %)</title><text x="0" y="${y + 16}" font-size="11">${esc(name)}</text><rect class="hbar" x="${lw}" y="${y + 5}" width="${Math.max(bwid, v ? 2 : 0).toFixed(1)}" height="14" ${v === 0 ? 'fill-opacity="0.15"' : ''}/><text class="val" x="${w}" y="${y + 16}" text-anchor="end" font-size="11">${fmtv(v)}</text></a>`;
    }).join('')}</svg>`;
  };
  h += `<div class="charts">
    <div class="chart"><h3>Sessions by day, June 2026</h3><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sessions per day; each bar links to that day's sessions">${gridY}${bars}<line class="axis" x1="${padL}" x2="${W}" y1="${H - padB}" y2="${H - padB}"/></svg><p class="foot">Day of observed start${N.fn('observed')}. Bars are links.</p></div>
    <div class="chart"><h3>Input tokens by model</h3>${hbars(d.models, 'model', d.input.value || 1, abbr)}<p class="foot">Abbreviated; exact values in the table below and on hover.</p></div>
    <div class="chart"><h3>Tool calls by tool</h3>${hbars(d.tools, 'tool', d.tool_calls, v => v.toLocaleString('en-US'))}<p class="foot">${n(d.tool_calls)} recorded tool calls${N.fn('tool_calls')}.</p></div>
  </div>`;

  const q = d.quality;
  h += `<div class="quality" role="list" aria-label="Quality strip">
    <div role="listitem"><b>${n(q.rejects)}</b> rejected records${N.fn('quality')}</div>
    <div role="listitem" class="${q.missing_usage ? 'warn' : ''}"><b>${n(q.missing_usage)}</b> model calls without usage${q.missing_usage ? ` <a href="#/sessions?issue=missing_usage" class="small">show</a>` : ''}</div>
    <div role="listitem" class="${q.unknown_ts ? 'warn' : ''}"><b>${n(q.unknown_ts)}</b> tool calls with unknown timestamps${q.unknown_ts ? ` <a href="#/sessions?issue=unknown_ts" class="small">show</a>` : ''}</div>
    <div role="listitem" class="${q.unlinked ? 'warn' : ''}"><b>${n(q.unlinked)}</b> unlinked tool calls${q.unlinked ? ` <a href="#/sessions?issue=unlinked" class="small">show</a>` : ''}</div>
  </div>`;

  h += `<section class="part" aria-labelledby="h-bymodel"><h2 id="h-bymodel">Input tokens by model <span class="aside">exact</span></h2><table class="stmt" style="max-width:560px"><caption class="vh">Input tokens by model, exact values</caption>
    <thead><tr><th scope="col">Model</th><th scope="col">Semantics</th><th scope="col" class="num">Input tokens</th></tr></thead><tbody>
    ${d.models.map(([m, v]) => `<tr><td>${m}</td><td class="muted small">${m.startsWith('gpt') ? 'tracelab-codex' : 'tracelab-claude'}</td><td class="num">${n(v)}</td></tr>`).join('')}
    <tr class="total"><td>Input tokens</td><td></td><td class="num">${n(d.input.value)}</td></tr></tbody></table></section>`;
  return h + N.render();
}

function renderSessions(query, mock) {
  const N = noteBook();
  if (mock === 'loading') return loadingDoc('Sessions', 'sessions');
  if (mock === 'error') return errorDoc('Sessions', 'invalid_input', 'The filter is not valid.', 'details[0].path agent, message "unknown agent \'claud\'"');
  const day = query.get('day'), model = query.get('model'), tool = query.get('tool'), issue = query.get('issue');
  let rows = SESSIONS, why = 'all sessions in scope';
  if (day) { rows = SESSIONS.filter(s => s.start.startsWith(day)); why = `sessions whose observed start${N.fn('observed')} falls on ${day}`; }
  else if (model) { rows = model.startsWith('gpt') ? SESSIONS.filter(s => s.agent === 'codex') : SESSIONS.filter(s => s.agent === 'claude-code'); why = `sessions with at least one call to ${model}`; }
  else if (tool) { rows = SESSIONS.filter(s => s.tc > 0); why = `sessions with at least one ${tool} tool call`; }
  else if (issue) { rows = SESSIONS.filter(s => s.agent === 'codex'); why = { missing_usage: 'sessions with model calls lacking usage', unknown_ts: 'sessions with tool calls whose timestamps could not be parsed', unlinked: 'sessions with unlinked tool calls' }[issue]; }
  if (mock === 'empty') rows = [];
  let h = docHead('Sessions', `Listing ${why}. Figures per session are exact; coverage is per session.`, `<b>${rows.length}</b> of 80 sessions${day || model || tool || issue ? `<br><a href="#/sessions">Clear the filter</a>` : ''}`);
  if (!rows.length) return h + `<div class="empty"><h3>No sessions match.</h3><p>Nothing in the ledger has ${why}. Widen the scope, or check the import journal for what was committed.</p><div class="actions"><a class="btn" href="#/sessions" style="text-decoration:none">Show all sessions</a><a href="#/imports">Open the journal</a></div></div>` + N.render();
  h += `<div class="tbl-wrap"><table class="stmt"><caption class="vh">Sessions</caption><thead><tr>
    <th scope="col">Session</th><th scope="col">Agent</th><th scope="col">Observed start</th><th scope="col">Observed end</th><th scope="col" class="num">Model calls</th><th scope="col" class="num">Tool calls</th><th scope="col" class="num">Input tokens${N.fn('input_tokens')}</th><th scope="col" class="num">Coverage${N.fn('coverage')}</th></tr></thead><tbody>
    ${rows.map(s => `<tr><td><a href="#/sessions/${s.id}" class="cell-id">${esc(s.ext)}</a><br><span class="muted small">${s.repo}</span></td><td>${s.agent}</td><td class="num small">${ts(s.start)}</td><td class="num small">${ts(s.end)}</td><td class="num">${n(s.mc)}</td><td class="num">${n(s.tc)}</td><td class="num">${n(s.input)}</td><td class="num small">${s.known} / ${s.total}</td></tr>`).join('')}
  </tbody></table></div>`;
  return h + N.render();
}

function renderSession(id, mock) {
  const N = noteBook();
  if (mock === 'loading') return loadingDoc('Session', 'the session');
  const s = SESSIONS.find(x => x.id === id);
  if (mock === 'error' || !s) return errorDoc('Session', 'not_found', `No session has the id ${id}.`);
  const det = SESSION_DETAIL;
  const isMain = id === det.id;
  let h = docHead(`Session <span class="mono" style="font-size:.7em;letter-spacing:0">${esc(s.ext)}</span>`, `Observed in <b>${'tracelab'}</b> by <b>${s.agent}</b>, imported by <a href="#/imports/${det.imp}">${det.imp}</a> with tracelab-v1 revision 1.`, `Session id <b class="mono">${s.id}</b><br><button class="btn sm" type="button" data-prov="session">Trace to source</button>`);

  h += `<section class="part" aria-labelledby="h-id"><h2 id="h-id">Identity</h2><div class="two">
    <dl class="kv"><dt>External id</dt><dd class="mono">${esc(s.ext)}</dd><dt>Source</dt><dd>tracelab</dd><dt>Agent</dt><dd>${s.agent}</dd><dt>Repository</dt><dd class="mono">${s.repo}</dd><dt>User</dt><dd class="mono">${s.user}</dd></dl>
    <table class="stmt"><caption class="vh">Intervals</caption><thead><tr><th scope="col">Interval</th><th scope="col">Start</th><th scope="col">End</th></tr></thead><tbody>
      <tr><td>Observed${N.fn('observed')}</td><td class="num small">${ts(s.start)}</td><td class="num small">${ts(s.end)}</td></tr>
      <tr><td>Declared ${isMain ? `<span class="small" style="color:var(--warn)">reversed, see diagnostics</span>` : ''}</td><td class="num small">${isMain ? ts(det.declared_start) : ts(null)}</td><td class="num small">${isMain ? ts(det.declared_end) : ts(null)}</td></tr>
    </tbody></table></div></section>`;

  h += `<section class="part" aria-labelledby="h-tok"><h2 id="h-tok">Tokens</h2><table class="stmt" style="max-width:620px"><caption class="vh">Token totals for this session</caption>
    <thead><tr><th scope="col">Measure</th><th scope="col" class="num">Value</th><th scope="col" class="num">Coverage${N.fn('coverage')}</th><th scope="col">Semantics</th></tr></thead><tbody>
    <tr><td>Input tokens${N.fn('input_tokens', { cov: `${s.known} / ${s.total} calls`, prov: 'session' })}</td><td class="num">${n(s.input)}</td><td class="num">${s.known} / ${s.total} calls</td><td class="small">tracelab-claude</td></tr>
    <tr><td>Output tokens${N.fn('output_tokens')}</td><td class="num">${isMain ? n(334 + 867) : n(null)}</td><td class="num">${isMain ? '2 / 2' : '0 / ' + s.total} calls</td><td class="small">tracelab-claude</td></tr>
    <tr><td>Cache read tokens</td><td class="num">${isMain ? n(15_402 + 31_119) : n(null)}</td><td class="num">${isMain ? '2 / 2' : '0 / ' + s.total} calls</td><td class="small">tracelab-claude only</td></tr>
  </tbody></table></section>`;

  const mcs = isMain ? det.model_calls : [];
  const tcs = isMain ? det.tool_calls : [];
  h += `<section class="part" aria-labelledby="h-mc"><h2 id="h-mc">Model-call observations${N.fn('model_calls')} <span class="aside">${n(s.mc)} recorded</span></h2>`;
  h += mcs.length ? `<div class="tbl-wrap"><table class="stmt"><caption class="vh">Model calls</caption><thead><tr><th scope="col">Sequence</th><th scope="col">Model</th><th scope="col">Started</th><th scope="col">Ended</th><th scope="col" class="num">Input</th><th scope="col" class="num">Output</th><th scope="col" class="num">Cache read</th><th scope="col">Semantics</th><th scope="col">Source</th></tr></thead><tbody>
    ${mcs.map(m => `<tr><td class="num">${m.seq}</td><td>${m.model}<br><span class="cell-id muted">${m.id}</span></td><td class="num small">${ts(m.start)}</td><td class="num small">${ts(m.end)}</td><td class="num">${n(m.input)}</td><td class="num">${n(m.output)}</td><td class="num">${n(m.cache_read)}</td><td class="small">${m.sem}</td><td><button class="btn sm" type="button" data-prov="observation" data-loc="${m.loc}" data-obs="${m.id}" aria-label="Source record for model call ${m.seq}">Source record</button></td></tr>`).join('')}
  </tbody></table></div>` : `<p class="prose muted">${n(s.mc)} observations; this mockup carries rows for one session only. <a href="#/sessions/ses_c736618a4d2f4b9e8a17">Open the worked session</a>.</p>`;
  h += `</section>`;

  h += `<section class="part" aria-labelledby="h-tc"><h2 id="h-tc">Tool-call observations${N.fn('tool_calls')} <span class="aside">${n(s.tc)} recorded</span></h2>`;
  h += tcs.length ? `<div class="tbl-wrap"><table class="stmt"><caption class="vh">Tool calls</caption><thead><tr><th scope="col">Tool</th><th scope="col">Model call</th><th scope="col">Emitted</th><th scope="col">Result</th><th scope="col" class="num">Wall latency</th><th scope="col">Error</th><th scope="col">Source</th></tr></thead><tbody>
    ${tcs.map(t => `<tr><td>${t.tool}<br><span class="cell-id muted">${t.id}</span></td><td class="cell-id">${t.mc.slice(0, 11)}…</td><td class="num small">${ts(t.start)}</td><td class="num small">${ts(t.end)}</td><td class="num">${n(t.ms)} ms</td><td>${t.err === null ? '<span class="muted"><i>Unavailable</i></span>' : t.err ? 'Yes' : 'No'}</td><td><button class="btn sm" type="button" data-prov="observation" data-loc="${t.loc}" data-obs="${t.id}" aria-label="Source record for tool call ${t.tool}">Source record</button></td></tr>`).join('')}
  </tbody></table></div>` : `<p class="prose muted">${s.tc ? `${n(s.tc)} observations; rows are carried for the worked session only.` : 'This session recorded no tool calls.'}</p>`;
  h += `</section>`;

  h += `<section class="part" aria-labelledby="h-diag"><h2 id="h-diag">Diagnostics <span class="aside">${isMain ? det.diagnostics.length : 0} raised</span></h2>`;
  h += isMain ? `<table class="stmt" style="max-width:820px"><caption class="vh">Diagnostics</caption><thead><tr><th scope="col">Code</th><th scope="col">Field</th><th scope="col">Message</th></tr></thead><tbody>${det.diagnostics.map(dg => `<tr><td class="mono small">${dg.code}</td><td class="mono small">${dg.field}</td><td>${esc(dg.message)}</td></tr>`).join('')}</tbody></table>` : `<p class="prose muted">No diagnostics. Declared and observed values agree where both exist.</p>`;
  h += `</section>`;
  return h + N.render();
}

    return `<tr class="${bad ? 'bad' : ''}"><td class="mono small">${esc(r.target)}</td><td class="path"><input type="text" value="${esc(r.src)}" aria-label="Source for ${esc(r.target)}" style="width:100%"></td>
      <td>${r.unit ? `<div style="display:flex;gap:6px;align-items:center"><span class="mono small">timestamp</span><select data-act="unit" aria-label="Timestamp unit" class="${bad ? 'invalid' : ''}"><option value="">unit…</option><option value="s" ${mapUI.unit === 's' ? 'selected' : ''}>seconds</option><option value="ms" ${mapUI.unit === 'ms' ? 'selected' : ''}>milliseconds</option></select></div>${bad ? `<p class="err" id="unit-err">Unit must be declared for integer timestamps.</p>` : ''}` : `<span class="mono small">${esc(r.tf)}</span>`}</td>
      <td><span class="why">${esc(r.why)}</span>${r.amb ? `<br><span class="amb">Ambiguous</span> <span class="why">${esc(r.amb)}</span>` : ''}</td></tr>`;
  }).join('')}
  </tbody></table></div>
  <div class="actions"><button class="btn" type="button" data-act="validate">Validate</button><button class="btn" type="button" data-act="mpreview" ${mapUI.unit ? '' : 'disabled'}>Preview on 200 rows</button><span class="spacer"></span><button class="btn" type="button" ${mapUI.unit ? '' : 'disabled'}>Save as revision 3</button><button class="btn primary" type="button" ${mapUI.unit ? '' : 'disabled'} onclick="location.hash='#/import'">Import 2,000 rows</button></div>
  <p class="hint" id="map-status" role="status">${mapUI.unit ? 'Valid. 2 ambiguities remain; they do not block a preview.' : 'Preview, save and import unlock when validation passes.'}</p>
  ${mapUI.previewed ? `<div class="two" style="margin-top:24px"><table class="stmt"><caption>Preview, 200 rows</caption><tbody><tr><td>Accepted</td><td class="num">198</td></tr><tr><td>Rejected <span class="desc">— invalid_type on usage.prompt_tokens</span></td><td class="num" style="color:var(--bad)">2</td></tr><tr class="total"><td>Sampled</td><td class="num">200</td></tr></tbody></table><table class="stmt"><caption>Observations emitted</caption><tbody><tr><td>Sessions</td><td class="num">198</td></tr><tr><td>Model calls</td><td class="num">198</td></tr><tr><td>Tool calls</td><td class="num">312</td></tr><tr class="total"><td>Observations</td><td class="num">708</td></tr></tbody></table></div>` : ''}
  </section></div>`;

  h += `<aside class="convo" aria-labelledby="h-convo"><h2 id="h-convo">Conversation</h2><div class="log" id="convo-log" aria-live="polite">${mapUI.messages.map(m => `<div class="msg ${m.who}"><p class="who">${m.who === 'you' ? 'You' : 'Assistant'}</p>${m.html}</div>`).join('')}</div>
    <form data-act="ask"><label class="vh" for="ask">Ask the assistant</label><textarea id="ask" placeholder="Ask about a field or request a change to the mapping"></textarea><div style="display:flex;justify-content:space-between;align-items:center"><span class="foot">Replies revise the table above; they never write to the ledger.</span><button class="btn primary sm" type="submit">Send</button></div></form></aside></div>`;
  return h + N.render();
}

function renderDefinitions(mock) {
  const N = noteBook();
  if (mock === 'loading') return loadingDoc('Definitions', 'metric definitions');
  if (mock === 'error') return errorDoc('Definitions', 'internal_error', 'Definitions could not be read.');
  const rows = [
    ['Sessions', 'sessions', 'count', 'derived; reducer', 'Comparable across sources when both declare a session identity key.'],
    ['Model calls', 'model_calls', 'count', 'observation', 'Counts observations, not distinct calls; overlapping exports inflate it.'],
    ['Tool calls', 'tool_calls', 'count', 'observation', 'Includes unlinked tool calls; see quality strip.'],
    ['Input tokens', 'input_tokens', 'tokens', 'tracelab-claude, tracelab-codex, swe-chat-usage', 'Summable within one semantics; sums across semantics are shown with by-semantics breakdown.'],
    ['Output tokens', 'output_tokens', 'tokens', 'per call', 'Excludes reasoning output tokens, kept as a separate measure.'],
    ['Coverage', 'coverage', 'known / total', 'per metric', 'A ratio; a metric with coverage 0 is Unavailable.'],
    ['Observed span', 'observed', 'timestamps', 'per session', 'Not active time. Declared intervals are separate and never override it.'],
  ];
  let h = docHead('Definitions', 'Every figure in this ledger is computed from one of these definitions. The superscripts on other pages link here.', `Metric layer <b>v0.1</b><br>${rows.length} definitions`);
  h += `<div class="tbl-wrap"><table class="stmt"><caption class="vh">Metric definitions</caption><thead><tr><th scope="col">Metric</th><th scope="col">Definition</th><th scope="col">Unit</th><th scope="col">Semantics</th><th scope="col">Comparability</th></tr></thead><tbody>
    ${rows.map(r => `<tr id="def-${r[1]}"><td style="white-space:nowrap">${r[0]}</td><td style="max-width:380px">${esc(NOTES[r[1]].text)}</td><td class="small">${r[2]}</td><td class="small">${r[3]}</td><td class="small">${r[4]}</td></tr>`).join('')}
  </tbody></table></div>`;
  return h;
}

/* =====================================================================
   Provenance sheet
   ===================================================================== */
function openProvenance(level, ctx = {}) {
  const key = ctx.key || 'input_tokens';
  const loc = ctx.loc || 'line:3117';
  const obs = ctx.obs || 'mc_ce3dc3374a1b5e2f8d09';
  const order = ['metric', 'session', 'observation'];
  const cur = order.indexOf(level);
  const d = DASH[dashUI.scope];
  const metricValue = { sessions: n(d.sessions), model_calls: n(d.model_calls), input_tokens: n(d.input.value), output_tokens: d.output.value == null ? '<i>Unavailable</i>' : n(d.output.value) }[key] || n(d.input.value);
  const steps = [
    { lvl: 0, t: 'Figure', w: NOTES[key].title, b: `<span class="figure num" style="font-size:20px;font-family:var(--serif)">${metricValue}</span> for ${d.label}.` },
    { lvl: 0, t: 'Definition', w: NOTES[key].title, b: `${esc(NOTES[key].text)}<dl class="kv"><dt>Unit</dt><dd>${key.includes('tokens') ? 'tokens' : 'count'}</dd><dt>Coverage</dt><dd class="num">${key === 'output_tokens' ? `${n(d.output.known)} / ${n(d.output.total)} calls` : `${n(d.input.known)} / ${n(d.input.total)} calls`}</dd><dt>Semantics</dt><dd>${Object.keys(d.input.by).join(', ')}</dd></dl><p style="margin-top:8px"><a href="#/definitions">All definitions</a></p>` },
    { lvl: 0, t: 'Contributing sessions', w: `${n(d.sessions)} in scope`, b: `Every session in scope contributes its own exact total. <a href="#/sessions">List them</a>; the largest contributor is <a href="#/sessions/ses_91b3d6f0a4c27e5d19f8">claude:a4d0e7c2…</a> with 21,775,902 input tokens. Below, the worked example.` },
    { lvl: 1, t: 'Session', w: 'claude:781a3b4c-a1a5-9325-16d3-4029ecc3fe43', b: `<a href="#/sessions/ses_c736618a4d2f4b9e8a17">ses_c736618a4d2f4b9e8a17</a>, agent claude-code, repo project_8f998460. Input tokens <span class="num">48,187</span>, coverage 2 / 2 calls, semantics tracelab-claude. Observed 2026-06-04 02:51:06.901 to 02:52:00.698 UTC.` },
    { lvl: 2, t: 'Observation', w: obs, b: `Emitted by rule <span class="mono">${obs.startsWith('tc') ? 'tool_call' : 'model_call'}</span> of <a href="#/mapping">tracelab-v1 revision 1</a> (map_82934058a2f6af1cbfc6) during <a href="#/imports/imp_3e21f89dbaef419a8f60">imp_3e21f89dbaef419a8f60</a>.<dl class="kv">${obs.startsWith('tc') ? `<dt>tool_name</dt><dd>from <span class="mono">$.tools[i].name</span></dd><dt>wall_latency_ms</dt><dd>result_at minus emitted_at, integer ms</dd>` : `<dt>input_tokens</dt><dd class="num">16,147 from <span class="mono">$.input_tokens_total</span>, strict integer</dd><dt>token_semantics</dt><dd>tracelab-claude, from <span class="mono">$.provider</span> via enum map</dd><dt>started_at</dt><dd>from <span class="mono">$.timing_events[event = request_sent].ts</span></dd>`}</dl>` },
    { lvl: 2, t: 'Source record', w: `${loc} of tracelab-sample.jsonl.gz`, b: `<dl class="kv"><dt>File SHA-256</dt><dd>${hash(SHA)}</dd><dt>Locator</dt><dd class="mono">${loc}</dd><dt>Stored</dt><dd>2026-09-06 17:22:05 UTC, 681,057 bytes</dd></dl><p style="margin-top:8px" class="small muted">Bytes as stored, pretty-printed by the server; numbers are not re-parsed by the browser.</p><pre class="raw">${esc(RAW_3117).replace('"input_tokens_total": 16147', '<mark>"input_tokens_total": 16147</mark>')}</pre><div class="actions" style="margin-top:12px"><button class="btn sm" type="button" data-act="copyhash">Copy SHA-256</button><button class="btn sm" type="button" data-act="copyraw">Copy record</button></div>` },
  ];
  $('#sheet-body').innerHTML = `<p class="small muted" style="margin-bottom:12px">From the figure to the bytes. Steps above the one you opened are folded; open any of them.</p><ol class="chain">${steps.map((s, i) => `<li class="${s.lvl < cur ? 'compact' : ''}" ${(s.lvl === cur && (i === steps.length - 1 || steps[i + 1].lvl !== cur)) ? 'aria-current="step"' : ''}><h3><button type="button" class="fn" style="vertical-align:baseline;font-size:12px;padding:0;margin:0 6px 0 0" data-act="expandstep" aria-expanded="${s.lvl >= cur}" aria-label="${s.lvl < cur ? 'Expand' : 'Collapse'} ${s.t}">${s.lvl < cur ? '+' : '–'}</button>${s.t} <span class="what">${esc(s.w)}</span></h3><div class="b">${s.b}</div></li>`).join('')}</ol>`;
  const dlg = $('#sheet');
  dlg.returnFocus = document.activeElement;
  if (!dlg.open) dlg.showModal();
  const focusTarget = $('#sheet [aria-current="step"] .b a, #sheet [aria-current="step"] .b button') || $('#sheet [data-close-sheet]');
  requestAnimationFrame(() => { const cur = $('#sheet [aria-current="step"]'); if (cur) cur.scrollIntoView({ block: 'start' }); focusTarget.focus(); });
  $('#live').textContent = 'Provenance sheet opened.';
}
function closeSheet() { const dlg = $('#sheet'); if (dlg.open) dlg.close(); if (dlg.returnFocus && dlg.returnFocus.isConnected) dlg.returnFocus.focus(); }

/* =====================================================================
   Popovers (footnotes)
   ===================================================================== */
function closePops() { document.querySelectorAll('.pop').forEach(p => p.remove()); document.querySelectorAll('.fn[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false')); }
function togglePop(btn) {
  const open = btn.getAttribute('aria-expanded') === 'true';
  closePops();
  if (open) return;
  const key = btn.dataset.note, note = NOTES[key];
  const pop = document.createElement('div');
  pop.className = 'pop'; pop.setAttribute('role', 'group'); pop.setAttribute('aria-label', `Note: ${note.title}`);
  pop.innerHTML = `<h4>${esc(note.title)}</h4><p>${esc(note.text)}</p>${btn.dataset.cov ? `<dl><dt>Coverage</dt><dd class="num">${esc(btn.dataset.cov)}</dd></dl>` : ''}<div class="links"><a href="#note-${key}" data-act="tonote">Read note ${btn.textContent} below</a>${btn.dataset.provkey ? `<a href="#" data-prov="metric" data-key="${btn.dataset.provkey}">Trace to source</a>` : ''}<a href="#/definitions">Definitions</a></div>`;
  btn.parentElement.appendChild(pop);
  const r = pop.getBoundingClientRect();
  if (r.right > window.innerWidth - 16) pop.classList.add('right');
  btn.setAttribute('aria-expanded', 'true');
}

/* =====================================================================
   Router and events
   ===================================================================== */
let mockState = 'normal';
function setMock(v) { mockState = v; $('#mockstate').value = v; render(); }
function render() {
  closePops();
  const hashv = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const [pathPart, qs] = hashv.split('?');
  const query = new URLSearchParams(qs || '');
  const parts = pathPart.split('/');
  const main = $('#main');
  let html, route = parts[0];
  if (route === 'import') html = renderImport(mockState);
  else if (route === 'imports' && parts[1]) html = renderReport(parts[1], mockState);
  else if (route === 'imports') html = renderImports(mockState);
  else if (route === 'sessions' && parts[1]) html = renderSession(parts[1], mockState);
  else if (route === 'sessions') html = renderSessions(query, mockState);
  else if (route === 'mapping') html = renderMapping(mockState);
  else if (route === 'definitions') html = renderDefinitions(mockState);
  else { route = 'dashboard'; html = renderDashboard(mockState); }
  main.innerHTML = html;
  document.querySelectorAll('.masthead nav a').forEach(a => a.toggleAttribute('aria-current', false) || (a.dataset.route === route ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current')));
  const h1 = $('#main h1');
  document.title = `${h1 ? h1.textContent.replace(/\s+/g, ' ').trim() : 'AgentScope'} · AgentScope ledger`;
  $('#live').textContent = `${h1 ? h1.textContent : ''} loaded.`;
  if (render.lastRoute !== route) { window.scrollTo(0, 0); main.focus({ preventScroll: true }); }
  render.lastRoute = route;
}

function later(ms, fn) { setTimeout(fn, matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : ms); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-note], [data-prov], [data-act], [data-close-sheet]');
  if (!t) { if (!e.target.closest('.pop')) closePops(); return; }
  if (t.hasAttribute('data-close-sheet')) { closeSheet(); return; }
  if (t.dataset.note != null) { e.preventDefault(); togglePop(t); return; }
  if (t.dataset.prov) { e.preventDefault(); closePops(); openProvenance(t.dataset.prov, { key: t.dataset.key || t.closest('[data-provkey]')?.dataset.provkey, loc: t.dataset.loc, obs: t.dataset.obs }); return; }
  const act = t.dataset.act;
  if (act === 'tonote') { e.preventDefault(); const li = document.getElementById(t.getAttribute('href').slice(1)); closePops(); if (li) { document.querySelectorAll('.notes .hilite').forEach(x => x.classList.remove('hilite')); li.classList.add('hilite'); li.tabIndex = -1; li.scrollIntoView({ block: 'center' }); li.focus({ preventScroll: true }); } return; }
  if (act === 'choose') { importUI.stage = 'reading'; render(); later(900, () => { importUI.stage = 'uploaded'; render(); $('#mapping')?.focus(); }); }
  if (act === 'preview') { importUI.stage = 'previewing'; render(); later(1100, () => { importUI.stage = 'previewed'; render(); $('#h-prev')?.scrollIntoView({ block: 'start', behavior: 'smooth' }); }); }
  if (act === 'commit') { importUI.stage = 'importing'; render(); later(1200, () => { importUI.stage = 'empty'; location.hash = '#/imports/imp_b7d2c4e9f1a3058c6d24'; }); }
  if (act === 'reset') { e.preventDefault(); importUI.stage = 'empty'; render(); }
  if (act === 'scope') { dashUI.open = !dashUI.open; render(); if (dashUI.open) $('#f-agent')?.focus(); else $('[data-act="scope"]')?.focus(); }
  if (act === 'scopeclose') { dashUI.open = false; render(); $('[data-act="scope"]')?.focus(); }
  if (act === 'validate') { $('#map-status').textContent = mapUI.unit ? 'Valid. 2 ambiguities remain; they do not block a preview.' : 'One error: model_call.started_at needs a timestamp unit.'; if (!mapUI.unit) $('[data-act="unit"]')?.focus(); }
  if (act === 'mpreview') { mapUI.previewed = true; render(); }
  if (act === 'expandstep') { const li = t.closest('li'); li.classList.toggle('compact'); const open = !li.classList.contains('compact'); t.setAttribute('aria-expanded', String(open)); t.textContent = open ? '–' : '+'; }
  if (act === 'copyhash' || act === 'copyraw') { const text = act === 'copyhash' ? SHA : RAW_3117; navigator.clipboard?.writeText(text).catch(() => {}); t.textContent = 'Copied'; $('#live').textContent = act === 'copyhash' ? 'SHA-256 copied.' : 'Record copied.'; later(1500, () => { t.textContent = act === 'copyhash' ? 'Copy SHA-256' : 'Copy record'; }); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'mockstate') { mockState = e.target.value; render(); }
  if (e.target.dataset.act === 'rejfilter') { const code = e.target.value; $('#rej-table tbody').innerHTML = rejectRows(REJECTS_SWE.filter(r => !code || r.code === code)); $('#live').textContent = code ? `Filtered to ${code}.` : 'Showing all codes.'; }
  if (e.target.dataset.act === 'unit') { mapUI.unit = e.target.value; render(); $('[data-act="unit"]')?.focus(); }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.act === 'scopeform') { e.preventDefault(); dashUI.scope = $('#f-agent').value === 'codex' ? 'codex' : 'all'; dashUI.open = false; render(); $('[data-act="scope"]')?.focus(); }
  if (e.target.dataset.act === 'ask') {
    e.preventDefault(); const q = $('#ask').value.trim(); if (!q) return;
    mapUI.messages.push({ who: 'you', html: `<p>${esc(q)}</p>` });
    mapUI.messages.push({ who: 'asst', html: `<p>Noted. I re-read the profile for that: the change is applied in the table above as a draft edit and marked for validation. Nothing has been saved or imported.</p>` });
    render(); const log = $('#convo-log'); log.scrollTop = log.scrollHeight; $('#ask').focus();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if ($('.pop')) { const b = $('.fn[aria-expanded="true"]'); closePops(); b?.focus(); } else if (dashUI.open) { dashUI.open = false; render(); $('[data-act="scope"]')?.focus(); } } });
$('#sheet').addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) closeSheet(); });
$('#sheet').addEventListener('click', e => { if (e.target.closest('a[href^="#/"]')) closeSheet(); });
window.addEventListener('hashchange', render);
render();
</script>
