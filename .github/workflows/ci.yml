name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install (locked)
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check . ../scripts && uv run ruff format --check . ../scripts
      - name: Type check
        run: uv run mypy
      - name: Architecture boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest
      - name: Scripts
        run: uv run python -m unittest discover -s ../scripts -p 'test_*.py'

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install (locked)
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build

  # Browser smoke test: the built web app served by the backend on a throwaway
  # database (web/e2e). Chromium only, one worker, no retries.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend (locked)
        working-directory: backend
        run: uv sync --locked --all-groups
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install web (locked)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium-headless-shell
      - name: Build and run the browser tests
        working-directory: web
        run: pnpm e2e
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  # Single required status check for branch protection. Runs even when upstream
  # jobs fail so the check is always reported, and fails if any of them did
  # (a skipped or cancelled job counts as a failure).
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    needs: [backend, web, e2e]
    if: always()
    steps:
      - name: Verify all required jobs succeeded
        run: |
          echo "backend: ${{ needs.backend.result }}"
          echo "web:     ${{ needs.web.result }}"
          echo "e2e:     ${{ needs.e2e.result }}"
          [ "${{ needs.backend.result }}" = "success" ] && [ "${{ needs.web.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]
