[project]
name = "agentscope-app"
version = "0.1.0.dev0"
description = "Import, normalise and explore AI coding-agent traces"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "httpx2>=2.12.0",
    "jsonschema>=4.23",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentscope_app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentscope_app"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Clean Architecture dependency rules, enforced in CI by import-linter.
# Direction: interfaces -> infrastructure -> application -> domain.
# infrastructure may import application (it implements the ports) but never interfaces;
# application may import domain only; domain imports nothing from the app.
[tool.importlinter]
root_package = "agentscope_app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers"
type = "layers"
layers = [
    "agentscope_app.interfaces",
    "agentscope_app.infrastructure",
    "agentscope_app.application",
    "agentscope_app.domain",
]

# Note: forbidden-module contracts are a deny-list of the frameworks and clients
# this project uses or is likely to add. Keep them in sync when adding dependencies.
[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["agentscope_app.domain"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn",
    "sqlalchemy", "alembic",
    "pyarrow", "pandas",
    "httpx", "httpx2", "requests", "openai", "anthropic",
    "pydantic", "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Application is infrastructure-free"
type = "forbidden"
source_modules = ["agentscope_app.application"]
forbidden_modules = [
    "fastapi", "starlette", "uvicorn",
    "sqlalchemy", "alembic",
    "pyarrow", "pandas",
    "httpx", "httpx2", "requests", "openai", "anthropic",
    "pydantic_settings",
]
